name: OSSF Scorecard

# Automated security-posture scoring via the OpenSSF Scorecard (#184).
#
# Scorecard evaluates the repo against supply-chain / security best practices
# (branch protection, pinned dependencies, token permissions, dangerous
# workflow patterns, ...) and uploads findings to Code Scanning. Runs on a
# weekly schedule and on branch-protection changes; not per-PR (it scores the
# repository, not a diff).

on:
  branch_protection_rule:
  schedule:
    - cron: '31 6 * * 1'   # Mondays at 06:31 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the SARIF results
      id-token: write          # publish results to the OpenSSF API
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Drop Scorecard findings that are known won't-fix for this repository
      # BEFORE the SARIF reaches Code Scanning. Filtering here (rather than
      # dismissing alerts one by one) is durable: Scorecard emits a fresh SARIF
      # every run and fingerprint drift means per-alert dismissals come back
      # under new alert IDs.
      #
      # The published scorecard.dev score (README badge) is unaffected — this
      # only trims the Code Scanning tab and the issues security-alerts.yml
      # opens from it. Every rule NOT listed here (BranchProtectionID,
      # TokenPermissionsID, gitHubAction pins, ...) still fires.
      #
      # Suppressed whole rules:
      #   DangerousWorkflowID  — pr.yaml deliberately uses pull_request_target +
      #                          refs/pull/N/head so the workflow and the
      #                          protected config files come from main; see the
      #                          SECURITY NOTE header in pr.yaml.
      #   CodeReviewID         — solo-maintainer repository; requiring a second
      #                          approver would force admin-bypass on every PR.
      #   CIIBestPracticesID   — bestpractices.dev badge is an external
      #                          registration, not something CI can earn.
      #   PinnedDependenciesID / nugetCommand, RESTORE commands only —
      #                          `dotnet restore` / `nuget restore` /
      #                          `msbuild /t:restore` without --locked-mode.
      #                          Decided 2026-09-16 (D20-Dice): every csproj
      #                          pins exact versions and nuget.org is immutable,
      #                          so packages.lock.json only adds a content hash
      #                          — and because the SDK injects
      #                          Microsoft.NET.ILLink.Tasks at whatever version
      #                          it bundles, RestoreLockedMode broke every PR
      #                          on each SDK patch. Not worth the point.
      #                          Scorecard reports the same message for an
      #                          unversioned `dotnet add package` / `nuget
      #                          install`, so the filter also checks the SARIF
      #                          snippet and keeps those (a real regression).
      #                          (`dotnet tool install` is not something
      #                          Scorecard inspects at all.)
      #
      # Template-only entries — this repository has no csproj, so nothing can
      # satisfy them. They are applied ONLY when the workflow runs in
      # repo-template itself (`github.repository` guard on the env below), so a
      # repository generated from this template gets the real findings without
      # anyone having to remember to edit this list:
      #   FuzzingID            — no code to fuzz here. (Scorecard also has no
      #                          .NET fuzzing detector, so downstream repos with
      #                          CsCheck/SharpFuzz tests hit it too — decide
      #                          per repo.)
      #   SASTID               — codeql.yaml skips analysis when no C# exists,
      #                          so no commit here ever carries a CodeQL check
      #                          run. Downstream repos with code pass this.
      #   (pipCommand is NOT suppressed: zizmor/semgrep are hash-pinned via
      #   .github/requirements/*.txt and any regression should fire.)
      - name: Filter suppressed findings from SARIF
        shell: bash
        env:
          SUPPRESSED_RULES: 'DangerousWorkflowID CodeReviewID CIIBestPracticesID'
          # PinnedDependenciesID message substrings suppressed everywhere, but
          # only when the finding's snippet is a restore command (see the
          # comment block above).
          SUPPRESSED_PIN_KINDS: 'nugetCommand not pinned'
          SUPPRESSED_PIN_SNIPPET: '(^|[^A-Za-z0-9_.-])(dotnet(\.exe)?[[:space:]]+restore|nuget(\.exe)?[[:space:]]+restore|msbuild(\.exe)?[[:space:]].*/t:restore)'
          # Template-only rules (see the comment block above). Empty everywhere
          # except in repo-template itself, so downstream repositories never
          # inherit them.
          TEMPLATE_ONLY_RULES: ${{ github.repository == 'Chris-Wolfgang/repo-template' && 'FuzzingID SASTID' || '' }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not available on the runner; cannot filter SARIF."
            exit 1
          fi
          # Word-split the rule lists intentionally — one rule per line for
          # the jq -R/-s pipeline.
          # shellcheck disable=SC2086
          rules_json=$(printf '%s\n' $SUPPRESSED_RULES $TEMPLATE_ONLY_RULES | jq -R . | jq -s .)
          echo "Suppressed rules: $SUPPRESSED_RULES $TEMPLATE_ONLY_RULES"
          echo "Suppressed PinnedDependenciesID kinds: '${SUPPRESSED_PIN_KINDS}' when the snippet matches '${SUPPRESSED_PIN_SNIPPET}'"
          # Bind ruleId/message to variables before the boolean expression:
          # inside `$suppressed | index(.ruleId)` the `.ruleId` would be applied
          # to the array, not the result (jq 1.8 errors, older versions
          # silently keep everything).
          jq \
            --argjson suppressed "$rules_json" \
            --arg pinKinds "$SUPPRESSED_PIN_KINDS" \
            --arg pinSnippet "$SUPPRESSED_PIN_SNIPPET" \
            '
              .runs |= map(
                .results |= map(select(
                  (.ruleId // "") as $r
                  | (.message.text // "") as $t
                  | ([.locations[]?.physicalLocation.region.snippet.text // ""] | join(" ")) as $s
                  | (($suppressed | index($r)) == null)
                    and (($pinKinds != "" and $r == "PinnedDependenciesID" and ($t | test($pinKinds)) and ($s | test($pinSnippet; "i"))) | not)
                ))
              )
            ' results.sarif > results.filtered.sarif
          before=$(jq '[.runs[].results[]] | length' results.sarif)
          after=$(jq '[.runs[].results[]] | length' results.filtered.sarif)
          echo "Scorecard SARIF results: $before -> $after after suppression"
          mv results.filtered.sarif results.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
