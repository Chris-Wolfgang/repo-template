# Security alert triage (baseline item 20, E86.6)
#
# Nightly: every open code-scanning, secret-scanning, and Dependabot alert becomes one
# issue (label `security`); the issue is closed when the alert closes; push-protection
# bypasses get their own issue. Mondays (or on demand): a summary issue of alerts open
# longer than 7 days. Logic lives in scripts/security-alerts.ps1 so it can be run locally.
#
# Tokens: GITHUB_TOKEN reads code-scanning and secret-scanning alerts with
# `security-events: read`. Dependabot alerts are NOT readable with GITHUB_TOKEN on a
# personal account; add a repository secret SECURITY_ALERTS_TOKEN (fine-grained PAT,
# this repository only, permissions: Dependabot alerts read, Issues write, Metadata read)
# and it is used instead. Without it the Dependabot kind is skipped with a notice.
#
# Copilot Autofix needs `security-events: write`, so it is isolated in a second job that
# only runs when the repository variable SECURITY_ALERTS_AUTOFIX is 'true'.

name: Security Alert Triage

on:
  schedule:
    - cron: '17 3 * * *'   # nightly 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print actions without creating or closing anything'
        type: boolean
        default: false
      weekly_summary:
        description: 'Also produce the "open longer than 7 days" summary'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    name: "Triage security alerts"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: read
    outputs:
      new-code-alerts: ${{ steps.triage.outputs.new-code-alerts }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/security-alerts.ps1
          sparse-checkout-cone-mode: false

      - name: Triage
        id: triage
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN || github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          FORCE_SUMMARY: ${{ inputs.weekly_summary == true && '1' || '' }}
        run: |
          $flags = @()
          if ($env:DRY_RUN) { $flags += '-DryRun' }
          # Weekly summary on Mondays (UTC) or when requested.
          if ($env:FORCE_SUMMARY -or (Get-Date).ToUniversalTime().DayOfWeek -eq 'Monday') { $flags += '-WeeklySummary' }
          pwsh ./scripts/security-alerts.ps1 -Repository $env:GITHUB_REPOSITORY @flags

  autofix:
    name: "Request Copilot Autofix"
    needs: triage
    if: vars.SECURITY_ALERTS_AUTOFIX == 'true' && needs.triage.outputs.new-code-alerts != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/security-alerts.ps1
          sparse-checkout-cone-mode: false

      - name: Request autofix for new code-scanning alerts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS: ${{ needs.triage.outputs.new-code-alerts }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: |
          $flags = @()
          if ($env:DRY_RUN) { $flags += '-DryRun' }
          pwsh ./scripts/security-alerts.ps1 -Repository $env:GITHUB_REPOSITORY -RequestAutofix -AlertNumbers $env:ALERTS @flags
