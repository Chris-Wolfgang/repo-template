name: Actions Audit

# GitHub Actions workflow security/quality audit (#185).
#
#  - actionlint: static checker for workflow YAML + embedded shell (via
#    shellcheck). Gates the build on findings — workflows should be lint-clean.
#  - zizmor: security auditor for Actions (injection, unpinned actions,
#    over-broad permissions, ...). Every finding uploads to the Security tab
#    (SARIF); High-severity findings also fail the job. Deliberate patterns
#    are accepted with an inline `# zizmor: ignore[rule]` on the flagged key.
#
# Installed via `go install` / `pip install` (pinned) rather than third-party
# wrapper actions, to keep the supply chain small.

on:
  # Runs on every PR (not path-filtered) so the actionlint job can be a required
  # status check — a path-filtered required check would hang PRs that don't touch
  # .github/workflows/**. actionlint/zizmor are cheap (~20s) and idempotent.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install zizmor
        # Hash-pinned rather than a bare `pip install zizmor` (OSSF Scorecard
        # Pinned-Dependencies: "pipCommand not pinned by hash"). --require-hashes
        # makes pip verify every wheel it downloads and refuse anything not
        # listed, so the transitive tree is pinned too. Regenerate with the uv
        # command recorded in the header of the requirements file; the resolution
        # is universal, so it covers every runner platform and Python version.
        run: pip install --require-hashes -r .github/requirements/zizmor.txt

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        # In SARIF mode zizmor exits 0 whether or not it has findings (the
        # findings live in the SARIF), so a non-zero exit here is a real
        # failure (bad install, bad YAML, API error) and must fail the job —
        # the old `|| true` turned those into a false green. Findings are
        # gated by the step after the upload, so annotations always land.
        run: |
          zizmor --format sarif .github/workflows/ > zizmor.sarif
          if ! jq -e '.runs[0].results | type == "array"' zizmor.sarif >/dev/null; then
            echo "::error::zizmor produced no SARIF results array — see the log above."
            exit 1
          fi

      - name: Upload zizmor SARIF
        # A fork's pull_request token cannot write Code Scanning (security-events: write is
        # not granted), so the upload would fail after a successful scan. Skip it there; the
        # scan step above still gates the job.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: zizmor.sarif

      - name: Gate on high-severity findings
        # zizmor maps High severity to SARIF level=error; medium and below
        # upload as warning/note for the Security tab but do not block. A
        # finding that is deliberate (e.g. pr.yaml's pull_request_target) is
        # accepted with an inline `# zizmor: ignore[rule]` next to the flagged
        # key — do NOT use a .zizmor.yml at the repo root: zizmor only reads
        # .github/zizmor.yml, so a root file is silently ignored.
        run: |
          count=$(jq '[.runs[].results[] | select(.level == "error")] | length' zizmor.sarif)
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[] | select(.level == "error")
                   | "  \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) — \(.message.text)"' zizmor.sarif
            echo "::error::$count high-severity zizmor finding(s) — fix them or accept with an inline zizmor: ignore[...] comment (see Security → Code scanning)."
            exit 1
          fi
          echo "✅ No high-severity zizmor findings."
