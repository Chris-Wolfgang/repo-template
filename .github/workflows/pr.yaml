# Sequential PR validation workflow with coverage gating
# Stage 1: Linux tests with 90% coverage requirement
# Stage 2: Windows .NET (5.0-10.0) and .NET Framework (4.6.2-4.8.1) tests (only if Linux passes)
# Stage 3: macOS tests (only if Stage 2 passes)
#
# SECURITY NOTE:
# - Uses pull_request_target to run workflow from the trusted main branch, not from the PR branch
# - This prevents malicious workflow YAML changes in untrusted PR branches from taking effect
# - All checkout steps use PR refs (refs/pull/*/head) to check out PR code from the base repo
# - After checkout, configuration files (.editorconfig, BannedSymbols.txt, etc.) are fetched from
#   the main branch to prevent malicious PRs from disabling analyzers or bypassing code quality checks
# - If a PR changes any of these protected configuration files, CI explicitly fails with instructions
#   for a maintainer to manually review and verify the changes before merging
# - persist-credentials: false prevents the checkout token from being written to git config for subsequent git commands
#   (it does NOT, by itself, prevent steps from accessing github.token / GITHUB_TOKEN if you explicitly expose it)
# - Default GITHUB_TOKEN permissions are restricted to read-only repository contents to limit impact if exposed

name: PR Checks v3 (Gated)

permissions:
  contents: read

env:
  # Minimum line coverage for PRODUCTION assemblies (anything under src/).
  CODECOV_MINIMUM: 90
  # Minimum line coverage for TEST assemblies (anything under tests/).
  # Test code that never executes has no purpose — an uncovered helper, fake, or
  # branch in a test project is dead code and should be exercised or deleted.
  # This is LINE coverage; branch coverage legitimately can't reach 100%
  # (compiler-generated async state machines), and the gate reads only the
  # line-coverage column that ReportGenerator puts at end-of-row.
  CODECOV_TEST_MINIMUM: 100
  
on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:  # Runs from the main branch, not from PR branch; see SECURITY NOTE above
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # SECRETS SCAN: Detect leaked credentials before merge
  # ============================================================================
  secrets-scan:
    name: "Secrets Scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch trusted gitleaks config from main
        # Prevent PR from modifying .gitleaks.toml to bypass the scan.
        # Distinguish "file doesn't exist in main" (fine — gitleaks uses
        # defaults) from "checkout failed for any other reason" (abort —
        # silently using the PR version would defeat the guard).
        shell: bash
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if ! git fetch "$TRUSTED_MAIN_URL" main:refs/remotes/origin/main --depth=1; then
            echo "::error::Failed to fetch origin/main — aborting before gitleaks scan."
            exit 1
          fi
          if git cat-file -e origin/main:.gitleaks.toml 2>/dev/null; then
            if ! git checkout origin/main -- .gitleaks.toml; then
              echo "::error::Failed to checkout origin/main:.gitleaks.toml — aborting to prevent silent fall-back to PR version."
              exit 1
            fi
          else
            echo "::notice::.gitleaks.toml not present in origin/main — gitleaks will use defaults."
          fi

      - name: Run gitleaks
        # gitleaks-action@v2 does not support pull_request_target, so invoke the CLI directly.
        # Pinned to a specific version with SHA256 checksum verification for supply-chain
        # safety. Dependabot cannot bump a version inside a run: block - when bumping,
        # take the new SHA256 from gitleaks_<ver>_checksums.txt on the release page and
        # update scripts/build-pr.ps1 to the same version.
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          mkdir -p "$HOME/.local/bin"
          TARBALL="$(mktemp)"
          curl -sSfL -o "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c - || { echo "Checksum verification failed!"; exit 1; }
          tar xzf "$TARBALL" -C "$HOME/.local/bin" gitleaks
          rm -f "$TARBALL"
          export PATH="$HOME/.local/bin:$PATH"
          # `gitleaks git` (8.19+) replaces the deprecated `detect --source`: scans the
          # full history of the checkout (fetch-depth: 0 above) with .gitleaks.toml
          # picked up from the repository root.
          gitleaks git --verbose --redact .
        shell: bash

  # ============================================================================
  # DETECTION: Check if .csproj files exist
  # ============================================================================
  detect-projects:
    name: "Detect .NET Projects"
    runs-on: ubuntu-latest
    outputs:
      has-projects: ${{ steps.check-projects.outputs.has-projects }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      
      - name: Fetch trusted configuration files from main branch
        # Skip for Dependabot — its package-version bumps to protected files (e.g.
        # Directory.Build.props) are legitimate and should not be overwritten by main's
        # older versions. Dependabot's identity is GitHub-controlled and not spoofable.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          echo "Fetching configuration files from main branch to prevent malicious overrides..."
          
          # Fetch the main branch
          git fetch "$TRUSTED_MAIN_URL" main:main-branch
          
          # List of configuration files that should come from trusted main branch
          config_files=(
            "*.editorconfig"
            "Directory.Build.props"
            "Directory.Build.targets"
            "BannedSymbols.txt"
            "coverlet.runsettings"
            "*.globalconfig"
            "*.ruleset"
            "*.DotSettings"
            ".github/workflows/*.yml"
            ".github/workflows/*.yaml"
          )
          
          # Copy each configuration file from main branch if it exists
          for config_file in "${config_files[@]}"; do
            # Handle glob patterns
            if [[ "$config_file" == *"*"* ]]; then
              # Find files matching the pattern in main branch.
              # NOTE: use process substitution (`done < <(...)`) instead of a
              # plain pipeline. A piped `while` runs in a subshell — an
              # `exit 1` from inside would only kill the subshell, not the
              # outer step, letting a failed copy silently fall back to the
              # PR-supplied protected config. Process substitution runs the
              # loop in the parent shell so exit actually terminates the job.
              while read -r file; do
                if [ -n "$file" ]; then
                  echo "  ✓ Copying $file from main branch"
                  mkdir -p "$(dirname "$file")"
                  if ! git show "main-branch:$file" > "$file"; then
                    echo "::error::Failed to copy $file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                    exit 1
                  fi
                fi
              # Mask grep's exit 1 on zero matches with `|| true` — under
              # `set -eo pipefail`, an empty match would otherwise fail the step,
              # but a pattern like `*.ruleset` legitimately has no matches in
              # repos that don't ship one. The empty stream is fine; the while
              # loop simply doesn't iterate.
              done < <(git ls-tree -r --name-only main-branch | { grep -iE "${config_file//\*/.*}" || true; })
              # A file the PR ADDS under a protected pattern (a new nested .editorconfig,
              # .globalconfig, ...) is as effective as an edited one and has no main copy
              # to overwrite it with: remove it from the checkout.
              while read -r file; do
                if [ -n "$file" ] && ! git cat-file -e "main-branch:$file" 2>/dev/null; then
                  echo "  ✗ Removing PR-added $file (not in main branch)"
                  rm -f "$file"
                fi
              done < <(git ls-files | { grep -iE "${config_file//\*/.*}" || true; })
            else
              # Check if file exists in main branch
              if git cat-file -e "main-branch:$config_file" 2>/dev/null; then
                echo "  ✓ Copying $config_file from main branch"
                if ! git show "main-branch:$config_file" > "$config_file"; then
                  echo "::error::Failed to copy $config_file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                  exit 1
                fi
              else
                echo "  ℹ️  $config_file not found in main branch, skipping"
              fi
            fi
          done
          
          echo ""
          echo "✅ Configuration files secured - using versions from main branch"
      
      - name: Detect protected configuration file changes
        # Skip for Dependabot — its bumps to protected files (e.g. Directory.Build.props)
        # are legitimate. The guard's threat model is human PR authors disabling analyzers
        # in their own PRs; it does not apply to a trusted GitHub-controlled bot whose
        # only action is package-version updates.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # persist-credentials:false on the checkout, so the deepening fetch below needs the
          # job token for a private repository. Used on this one command only; never stored.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          echo "Checking for changes to protected configuration files in this PR..."
          
          # Verify main-branch ref is available (it was fetched in the previous step)
          if ! git cat-file -e main-branch 2>/dev/null; then
            echo "❌ main-branch ref not found - cannot detect configuration file changes"
            exit 1
          fi
          
          # Files this PR changes, relative to the merge base with main (three-dot), so a
          # PR that is merely behind main is not blamed for files main changed since it
          # branched. --diff-filter=AMRCD: Added, Modified, Renamed, Copied, Deleted -
          # a PR that *deletes* a workflow or .globalconfig is as security-relevant as an
          # edit. -i: Windows (and ReSharper on it) resolve names case-insensitively, so
          # foo.dotsettings is as live as foo.DotSettings.
          # The checkout is shallow (depth 1); the PR's own history is needed to find the
          # merge base. Deepen until one exists, then diff against it. Fail closed: a guard
          # that cannot compute the diff must not report "nothing changed".
          for _ in 1 2 3 4 5 6; do
            git merge-base main-branch HEAD >/dev/null 2>&1 && break
            git fetch --quiet --deepen=50 "$TRUSTED_MAIN_URL" "refs/pull/$PR_NUMBER/head" 2>/dev/null || true
          done
          if ! base=$(git merge-base main-branch HEAD 2>/dev/null); then
            echo "::error::Cannot find the merge base between main and the PR head - refusing to classify the change."
            exit 1
          fi
          mapfile -t all_changed < <(git diff --name-only --diff-filter=AMRCD "$base" HEAD)
          protected=(); other=()
          for file in "${all_changed[@]}"; do
            case "$file" in
              .editorconfig|Directory.Build.props|Directory.Build.targets|BannedSymbols.txt|coverlet.runsettings) protected+=("$file") ;;
              *)
                if echo "$file" | grep -qiE '(\.(globalconfig|ruleset|DotSettings|editorconfig)|^\.github/workflows/.*\.ya?ml)$'; then protected+=("$file"); else other+=("$file"); fi ;;
            esac
          done

          if [ ${#protected[@]} -eq 0 ]; then
            echo "✅ No protected configuration files changed - CI fully validates this PR"
          elif [ ${#other[@]} -eq 0 ]; then
            # Configuration-only PR. CI runs main's copies of these files, so nothing in
            # this run exercised the change - but nothing else changed either, so there is
            # no code the stale config could have mis-validated. It merges on review with
            # the ruleset fully active (baseline item 10: never disable a ruleset to merge).
            echo ""
            echo "⚠️  CONFIGURATION-ONLY PULL REQUEST - protected files changed, nothing else:"
            for file in "${protected[@]}"; do echo "  - $file"; done
            echo ""
            echo "::warning::Configuration-only PR: CI ran main's copies of ${#protected[@]} protected file(s), so this run did not exercise the change. Review the diff before merging; the next PR runs with the new configuration."
          else
            echo ""
            echo "⚠️  PROTECTED CONFIGURATION FILES CHANGED ALONGSIDE OTHER CHANGES:"
            for file in "${protected[@]}"; do echo "  - $file"; done
            echo ""
            echo "❌ CI uses the main branch version of these files to prevent security bypasses,"
            echo "   so the other ${#other[@]} file(s) in this PR were validated against the OLD configuration"
            echo "   and the configuration change itself was not tested."
            echo ""
            echo "Split the PR: put the protected files in their own PR (it passes this guard as"
            echo "configuration-only and merges on review), then rebase the rest on top so it is"
            echo "validated with the new configuration. Nothing here can be bypassed."
            exit 1
          fi
      
      - name: Check for .NET project files
        id: check-projects
        run: |
          if git ls-files '*.csproj' '*.vbproj' '*.fsproj' | grep -q .; then
            echo "has-projects=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found .NET project files - .NET build and test jobs will run"
          else
            echo "has-projects=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No .NET project files found - skipping .NET build and test jobs"
          fi

      - name: Verify src/ csprojs are in the solution
        # Guards against a class of drift that shipped a broken release
        # in Etl-DbClient v0.5.0: a new csproj was added under src/ (a
        # source generator) but never added to the .slnx file. Per-project
        # `dotnet test` still triggered its ProjectReference chain, so
        # pr.yaml never noticed; but the release pipeline's solution-level
        # `dotnet build` skipped it, and the runtime csproj's
        # `PackSourceGenerator` MSBuild target failed to find the missing
        # bin/Release/ output — blocking the release. This step catches
        # the same drift at PR time.
        #
        # Detection: for every src/**/*.csproj, verify at least one solution
        # file at the repo root references it by path (works for both .slnx
        # `<Project Path="…"/>` entries and .sln GUID lines). If a solution
        # file exists and a src csproj isn't listed, fail with the specific
        # missing entry and a `dotnet sln add` suggestion. Repos without a
        # solution file (or with everything already listed) pass
        # unconditionally.
        shell: bash
        run: |
          shopt -s nullglob
          slns=( *.slnx *.sln )
          if [ ${#slns[@]} -eq 0 ]; then
            echo "ℹ️  No solution file at repo root - skipping solution-consistency check."
            exit 0
          fi
          echo "Checking solution files: ${slns[*]}"

          missing=()
          # git ls-files always emits forward-slashed paths. .slnx entries
          # use forward slashes, but classic .sln GUID lines often use
          # backslashes (`src\Foo\Foo.csproj`). Check both encodings so a
          # repo with a legacy .sln at the root isn't a false positive.
          while IFS= read -r csproj; do
            csproj_bs="${csproj//\//\\}"
            found=0
            for sln in "${slns[@]}"; do
              if grep -qF "$csproj" "$sln" || grep -qF "$csproj_bs" "$sln"; then
                found=1
                break
              fi
            done
            if [ "$found" -eq 0 ]; then
              missing+=("$csproj")
            fi
          done < <(git ls-files 'src/**/*.csproj' 'src/*.csproj')

          if [ ${#missing[@]} -gt 0 ]; then
            echo ""
            echo "❌ SOLUTION CONSISTENCY FAILURE"
            echo ""
            echo "The following src/**/*.csproj files are NOT referenced by any solution file:"
            for m in "${missing[@]}"; do
              echo "  - $m"
            done
            echo ""
            echo "This breaks solution-level \`dotnet build\` (which release.yaml relies on"
            echo "for Pack & Validate), even though per-project \`dotnet test\` still works."
            echo ""
            echo "Fix: add the missing project(s) to the solution:"
            for sln in "${slns[@]}"; do
              echo "  dotnet sln $sln add ${missing[*]}"
              break
            done
            exit 1
          fi
          echo "✅ All src csprojs are referenced by a solution file - solution-level builds will include them."

  # ============================================================================
  # CHANGELOG: every PR that touches src/ must add a fragment under
  # changelog/unreleased/ (or carry the `no-changelog` label). The script is
  # taken from main so a PR cannot weaken its own check; the fragments and the
  # diff come from the PR head. See changelog/unreleased/README.md.
  # ============================================================================
  changelog-check:
    name: "Changelog Fragment Check"
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch trusted changelog script from main
        shell: bash
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if ! git fetch "$TRUSTED_MAIN_URL" main:refs/remotes/origin/main --depth=1; then
            echo "::error::Failed to fetch origin/main — aborting before changelog check."
            exit 1
          fi
          # Fail closed: never run the PR's own copy of the validator. (A first-adoption PR
          # cannot reach this job anyway — pull_request_target runs the base branch's pr.yaml,
          # so the job only exists once main carries both this workflow and the script.)
          if ! git cat-file -e origin/main:scripts/changelog.ps1 2>/dev/null; then
            echo "::error::scripts/changelog.ps1 is not present in origin/main — refusing to run the PR-controlled copy. Merge the script to main first."
            exit 1
          fi
          if ! git checkout origin/main -- scripts/changelog.ps1; then
            echo "::error::Failed to checkout origin/main:scripts/changelog.ps1 — aborting to prevent silent fall-back to the PR version."
            exit 1
          fi

      - name: Check for a changelog fragment
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git fetch "$env:TRUSTED_MAIN_URL" $env:BASE_SHA --depth=1
          pwsh ./scripts/changelog.ps1 check -BaseRef $env:BASE_SHA -Labels $env:PR_LABELS

  # ============================================================================
  # INSPECTCODE: JetBrains ReSharper InspectCode parallel to the test stages.
  # Runs concurrently with Stage 1 / 2 / 3 (no `needs:` on a test job) so it
  # doesn't extend wall-clock — typically 3–5 min vs the slowest stage.
  # SARIF uploads to GitHub Code Scanning (Security tab + inline PR
  # annotations). `error`-severity findings fail the job; `warning`-severity
  # surfaces in Code Scanning but doesn't fail (gated by --severity=WARNING
  # filter). Tune the noise floor via .DotSettings at the repo root.
  #
  # Runs on windows-latest so a solution that multi-targets .NET Framework
  # (net462-net481) builds natively — the reference assemblies are bundled
  # there, but not on ubuntu, where a whole-solution `dotnet build` fails.
  # The test stages sidestep this by building per project and filtering TFMs
  # per OS; InspectCode needs the whole solution built. Steps use bash
  # (`defaults.run.shell`) so the job body is the same on either OS.
  #
  # Same-repo PRs only: under pull_request_target `github.repository` is always
  # the base repo, so a fork PR would otherwise build untrusted code while the
  # job holds security-events: write. Protected config comes from main (same
  # fetch as the test stages) so a PR cannot tune .editorconfig/.DotSettings to
  # hide findings; a PR that ADDS a .DotSettings fails Detect .NET Projects.
  # ============================================================================
  inspectcode:
    name: "ReSharper InspectCode"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: detect-projects
    if: github.repository != 'Chris-Wolfgang/repo-template' && needs.detect-projects.outputs.has-projects == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # required for upload-sarif
      actions: read            # upload-sarif reads the workflow run to associate the analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false

      - name: Fetch trusted configuration files from main branch
        # Skip for Dependabot — its package-version bumps to protected files (e.g.
        # Directory.Build.props) are legitimate and should not be overwritten by main's
        # older versions. Dependabot's identity is GitHub-controlled and not spoofable.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          echo "Fetching configuration files from main branch to prevent malicious overrides..."
          
          # Fetch the main branch
          git fetch "$TRUSTED_MAIN_URL" main:main-branch
          
          # List of configuration files that should come from trusted main branch
          config_files=(
            "*.editorconfig"
            "Directory.Build.props"
            "Directory.Build.targets"
            "BannedSymbols.txt"
            "coverlet.runsettings"
            "*.globalconfig"
            "*.ruleset"
            "*.DotSettings"
            ".github/workflows/*.yml"
            ".github/workflows/*.yaml"
          )
          
          # Copy each configuration file from main branch if it exists
          for config_file in "${config_files[@]}"; do
            # Handle glob patterns
            if [[ "$config_file" == *"*"* ]]; then
              # Find files matching the pattern in main branch.
              # NOTE: use process substitution (`done < <(...)`) instead of a
              # plain pipeline. A piped `while` runs in a subshell — an
              # `exit 1` from inside would only kill the subshell, not the
              # outer step, letting a failed copy silently fall back to the
              # PR-supplied protected config. Process substitution runs the
              # loop in the parent shell so exit actually terminates the job.
              while read -r file; do
                if [ -n "$file" ]; then
                  echo "  ✓ Copying $file from main branch"
                  mkdir -p "$(dirname "$file")"
                  if ! git show "main-branch:$file" > "$file"; then
                    echo "::error::Failed to copy $file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                    exit 1
                  fi
                fi
              # Mask grep's exit 1 on zero matches with `|| true` — under
              # `set -eo pipefail`, an empty match would otherwise fail the step,
              # but a pattern like `*.ruleset` legitimately has no matches in
              # repos that don't ship one. The empty stream is fine; the while
              # loop simply doesn't iterate.
              done < <(git ls-tree -r --name-only main-branch | { grep -iE "${config_file//\*/.*}" || true; })
              # A file the PR ADDS under a protected pattern (a new nested .editorconfig,
              # .globalconfig, ...) is as effective as an edited one and has no main copy
              # to overwrite it with: remove it from the checkout.
              while read -r file; do
                if [ -n "$file" ] && ! git cat-file -e "main-branch:$file" 2>/dev/null; then
                  echo "  ✗ Removing PR-added $file (not in main branch)"
                  rm -f "$file"
                fi
              done < <(git ls-files | { grep -iE "${config_file//\*/.*}" || true; })
            else
              # Check if file exists in main branch
              if git cat-file -e "main-branch:$config_file" 2>/dev/null; then
                echo "  ✓ Copying $config_file from main branch"
                if ! git show "main-branch:$config_file" > "$config_file"; then
                  echo "::error::Failed to copy $config_file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                  exit 1
                fi
              else
                echo "  ℹ️  $config_file not found in main branch, skipping"
              fi
            fi
          done
          
          echo ""
          echo "✅ Configuration files secured - using versions from main branch"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          # Install every SDK the test stages install. Solutions that
          # multi-target out-of-support TFMs (netcoreapp3.1 / net5.0 /
          # net6.0 / net7.0) are not guaranteed to restore their targeting
          # packs under a lone 10.0.x SDK, so the solution build below can
          # fail even when the test stages (which install 3.1.x-10.0.x)
          # pass. Mirror those stages so InspectCode builds the same TFM set.
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve solution
        id: sln
        run: |
          # Find the solution to build and inspect, preferring .slnx (new format)
          # over .sln, and resolve it ONCE so restore, build and InspectCode all
          # target the same file. A bare `dotnet build` fails in repos with more
          # than one solution or project at the root, and would otherwise fail
          # with a generic CLI error before the clearer message below.
          # Use nullglob + array expansion instead of parsing `ls`: a glob with
          # no match expands to nothing rather than failing, so this is correct
          # under the step's `set -e -o pipefail` shell by construction — no `ls`
          # exit-2 to swallow, and no blanket `|| true` that would also hide a
          # genuine failure. Listing *.slnx before *.sln keeps any .slnx ahead
          # of a .sln in the array, so ${solutions[0]} is a .slnx when one exists.
          shopt -s nullglob
          solutions=(*.slnx *.sln)
          if [ ${#solutions[@]} -eq 0 ]; then
            echo "::error::No .slnx or .sln found at repo root — InspectCode needs one to run."
            exit 1
          fi
          echo "Solution: ${solutions[0]}"
          echo "path=${solutions[0]}" >> "$GITHUB_OUTPUT"

      - name: Restore .NET workloads
        # Same conditional as the test stages: a solution with workload-bearing
        # TFMs (net10.0-android, -ios, -maui, ...) cannot restore without them;
        # pure-library repos skip the ~5-15s of network-dependent setup.
        run: |
          if find . -name '*.csproj' -type f -exec grep -lE 'net[0-9]+\.[0-9]+-(android|ios|maccatalyst|maui|tvos|tizen|browser)' {} \; | grep -q .; then
            echo "Workload-bearing TFMs detected — running dotnet workload restore"
            dotnet workload restore
          else
            echo "No workload-bearing TFMs in any csproj — skipping dotnet workload restore"
          fi

      - name: Restore + Build (Release)
        env:
          SLN: ${{ steps.sln.outputs.path }}
        run: |
          dotnet restore "$SLN"
          dotnet build "$SLN" -c Release --no-restore

      - name: Install JetBrains.ReSharper.GlobalTools
        run: dotnet tool install -g JetBrains.ReSharper.GlobalTools

      - name: Run InspectCode
        env:
          SLN: ${{ steps.sln.outputs.path }}
        run: |
          # Global dotnet tools install under ~/.dotnet/tools; make sure `jb`
          # resolves regardless of whether that dir is already on PATH.
          export PATH="$HOME/.dotnet/tools:$PATH"
          echo "Inspecting: $SLN"
          jb inspectcode "$SLN" \
            --output=inspect.sarif \
            --format=sarif \
            --severity=WARNING \
            --no-build

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: inspect.sarif

      - name: Gate on error-severity findings
        run: |
          # SARIF level=error fails the job; warnings still upload (visible in
          # Security → Code scanning) but don't gate merge — raise to `error`
          # later when the noise floor is acceptable.
          count=$(jq '[.runs[].results[] | select(.level=="error")] | length' inspect.sarif)
          if [ "$count" -gt 0 ]; then
            echo "::error::$count InspectCode error-severity finding(s) — see Security → Code scanning"
            exit 1
          fi
          echo "✅ No error-severity InspectCode findings."

  # ============================================================================
  # STAGE 1: Linux - .NET Core/5+ Tests with Coverage Gate
  # ============================================================================
  test-linux-core: 
    name: "Stage 1: Linux Tests (.NET 5.0-10.0) + Coverage Gate"
    runs-on:  ubuntu-latest
    needs: detect-projects
    if: github.repository != 'Chris-Wolfgang/repo-template' && needs.detect-projects.outputs.has-projects == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      
      - name: Fetch trusted configuration files from main branch
        # Skip for Dependabot — its package-version bumps to protected files (e.g.
        # Directory.Build.props) are legitimate and should not be overwritten by main's
        # older versions. Dependabot's identity is GitHub-controlled and not spoofable.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          echo "Fetching configuration files from main branch to prevent malicious overrides..."
          
          # Fetch the main branch
          git fetch "$TRUSTED_MAIN_URL" main:main-branch
          
          # List of configuration files that should come from trusted main branch
          config_files=(
            "*.editorconfig"
            "Directory.Build.props"
            "Directory.Build.targets"
            "BannedSymbols.txt"
            "coverlet.runsettings"
            "*.globalconfig"
            "*.ruleset"
            "*.DotSettings"
            ".github/workflows/*.yml"
            ".github/workflows/*.yaml"
          )
          
          # Copy each configuration file from main branch if it exists
          for config_file in "${config_files[@]}"; do
            # Handle glob patterns
            if [[ "$config_file" == *"*"* ]]; then
              # Find files matching the pattern in main branch.
              # NOTE: use process substitution (`done < <(...)`) instead of a
              # plain pipeline. A piped `while` runs in a subshell — an
              # `exit 1` from inside would only kill the subshell, not the
              # outer step, letting a failed copy silently fall back to the
              # PR-supplied protected config. Process substitution runs the
              # loop in the parent shell so exit actually terminates the job.
              while read -r file; do
                if [ -n "$file" ]; then
                  echo "  ✓ Copying $file from main branch"
                  mkdir -p "$(dirname "$file")"
                  if ! git show "main-branch:$file" > "$file"; then
                    echo "::error::Failed to copy $file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                    exit 1
                  fi
                fi
              # Mask grep's exit 1 on zero matches with `|| true` — under
              # `set -eo pipefail`, an empty match would otherwise fail the step,
              # but a pattern like `*.ruleset` legitimately has no matches in
              # repos that don't ship one. The empty stream is fine; the while
              # loop simply doesn't iterate.
              done < <(git ls-tree -r --name-only main-branch | { grep -iE "${config_file//\*/.*}" || true; })
              # A file the PR ADDS under a protected pattern (a new nested .editorconfig,
              # .globalconfig, ...) is as effective as an edited one and has no main copy
              # to overwrite it with: remove it from the checkout.
              while read -r file; do
                if [ -n "$file" ] && ! git cat-file -e "main-branch:$file" 2>/dev/null; then
                  echo "  ✗ Removing PR-added $file (not in main branch)"
                  rm -f "$file"
                fi
              done < <(git ls-files | { grep -iE "${config_file//\*/.*}" || true; })
            else
              # Check if file exists in main branch
              if git cat-file -e "main-branch:$config_file" 2>/dev/null; then
                echo "  ✓ Copying $config_file from main branch"
                if ! git show "main-branch:$config_file" > "$config_file"; then
                  echo "::error::Failed to copy $config_file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                  exit 1
                fi
              else
                echo "  ℹ️  $config_file not found in main branch, skipping"
              fi
            fi
          done
          
          echo ""
          echo "✅ Configuration files secured - using versions from main branch"

      # Fix for .NET 5.0 on Ubuntu 22.04+ - install libssl1.1 from the focal-security
      # repository so APT verifies the package via GPG instead of a plain wget download.
      - name: Install OpenSSL 1.1 for .NET 5.0
        run: |
          # signed-by= points apt at the Canonical archive keyring that ships on all
          # GitHub-hosted Ubuntu runners. It contains the same signing key Canonical
          # uses across releases (focal, jammy, noble), so it can verify focal-security
          # packages from a non-focal runner without disabling signature checking.
          # Earlier iteration used [trusted=yes] (skipping verification) as a quick
          # unblock; this restores end-to-end signature verification.
          echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu focal-security main" | sudo tee /etc/apt/sources.list.d/focal-security.list
          sudo apt-get update -q
          sudo apt-get install --yes libssl1.1
          sudo rm /etc/apt/sources.list.d/focal-security.list

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore .NET workloads
        # Some projects (MAUI / MauiHybrid / Android / iOS / WPF) declare workloads via
        # their TFMs (e.g. net10.0-android). For workload-bearing repos this installs them
        # before restore; for pure-library repos with no workload TFMs, skip entirely to
        # avoid ~5-15s of network-dependent setup and an extra failure mode.
        shell: bash
        run: |
          if find . -name '*.csproj' -type f -exec grep -lE 'net[0-9]+\.[0-9]+-(android|ios|maccatalyst|maui|tvos|tizen|browser)' {} \; | grep -q .; then
            echo "Workload-bearing TFMs detected — running dotnet workload restore"
            dotnet workload restore
          else
            echo "No workload-bearing TFMs in any csproj — skipping dotnet workload restore"
          fi

      - name: Restore and build (exclude .NET Framework-only projects)
        run: |
          echo "Finding .NET project files in repository (via find command)..."
          
          # Filter out projects that ONLY target .NET Framework 4.x
          # Multi-targeting projects (e.g., net8.0;net48) will be INCLUDED
          projects=()
          project_found=false
          
          while IFS= read -r -d '' proj; do
            project_found=true
            # Check if project has any .NET 5+ target framework
            # Look for: net5.0, net6.0, net7.0, net8.0, net9.0, net10.0, or netcoreapp, netstandard
            # Normalize line endings to handle multi-line <TargetFramework> / <TargetFrameworks> elements
            if tr -d '\n\r' < "$proj" | grep -qE '<TargetFramework[s]?>.*(net(5\.0|6\.0|7\.0|8\.0|9\.0|10\.0)|netcoreapp|netstandard)'; then
              projects+=("$proj")
              echo "✓ Including: $proj (has .NET 5+ or .NET Core target)"
            else
              echo "⊘ Excluding: $proj (Framework-only, incompatible with Linux)"
            fi
          done < <(find . -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -print0)
          
          if [ "$project_found" = false ]; then
            echo "❌ No .NET projects found."
            echo "This should not occur as detect-projects already verified project existence."
            exit 1
          fi
          
          if [ ${#projects[@]} -eq 0 ]; then
            echo "❌ No compatible .NET projects found."
            echo "All projects target only .NET Framework 4.x, which is incompatible with Linux."
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "Projects to build:"
          echo "=========================================="
          printf '%s\n' "${projects[@]}"
          echo ""
          
          # Restore each project
          echo "Restoring projects..."
          for proj in "${projects[@]}"; do
            echo "Restoring: $proj"
            dotnet restore "$proj" || exit 1
          done
          
          echo ""
          echo "Building projects..."
          # Build each project, handling multi-targeting projects
          # For multi-targeting projects, build only Linux-compatible frameworks (.NET 5.0+, .NET Core, .NET Standard)
          for proj in "${projects[@]}"; do
            echo "Building: $proj"
            
            # Extract target frameworks via MSBuild property evaluation.
            # This handles multi-line <TargetFrameworks> XML, conditional property groups,
            # and TFMs inherited from Directory.Build.props — all of which break grep-based parsing.
            # Falls back from <TargetFrameworks> (multiple) to <TargetFramework> (single).
            tfm_raw=$(dotnet msbuild "$proj" -noLogo -getProperty:TargetFrameworks 2>/dev/null \
              | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFrameworks[=:][[:space:]]*//' | tr -d '[:space:]')
            if [ -z "$tfm_raw" ]; then
              tfm_raw=$(dotnet msbuild "$proj" -noLogo -getProperty:TargetFramework 2>/dev/null \
                | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFramework[=:][[:space:]]*//' | tr -d '[:space:]')
            fi
            frameworks=$(printf '%s' "$tfm_raw" | tr ';' '\n' | grep -E '^(net(5\.0|6\.0|7\.0|8\.0|9\.0|10\.0)|netcoreapp[0-9.]+|netstandard[0-9.]+)$' || true)
            
            if [ -z "$frameworks" ]; then
              echo "⚠️  No Linux-compatible frameworks found in $proj"
              continue
            fi
            
            # Check if this is a multi-targeting project
            framework_count=$(echo "$frameworks" | wc -l)
            
            if [ "$framework_count" -eq 1 ]; then
              # Single target framework - build normally
              echo "  Target framework: $frameworks"
              dotnet build "$proj" --no-restore --configuration Release || exit 1
            else
              # Multi-targeting project - build each compatible framework separately
              echo "  Target frameworks (multi-targeting): $(echo "$frameworks" | tr '\n' ' ')"
              while IFS= read -r fw; do
                [ -z "$fw" ] && continue
                echo "  Building framework: $fw"
                dotnet build "$proj" --no-restore --configuration Release --framework "$fw" || exit 1
              done <<< "$frameworks"
            fi
          done
          
          echo ""
          echo "✅ All compatible projects built successfully"

      - name: Run tests with coverage (.NET Core 5.0 - 10.0)
        # Explicit bash: GitHub's implicit default is `bash -e` WITHOUT
        # pipefail; the explicit form is `bash -eo pipefail`, which the
        # `dotnet test ... | tee` below needs so a failing test run is not
        # masked by tee's exit code.
        shell: bash
        run: |
          # Find all test projects (C#, VB.NET, F#).
          # Gracefully skip if there is no ./tests directory (e.g. template-publishing
          # repos or library repos in early development that have no tests yet).
          # The downstream coverage steps already handle the no-coverage-files case.
          # Fail loudly if the repo HAS src/ projects — the coverage gate
          # exists to enforce test coverage on shipping code, so silently
          # passing when tests are missing is the wrong default. Skip only
          # for template-pack / in-dev repos with no source projects yet.
          if [ ! -d ./tests ]; then
            if find ./src -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -print -quit 2>/dev/null | grep -q .; then
              echo "❌ ./tests directory is missing but ./src contains projects — refusing to silently skip the coverage gate."
              exit 1
            fi
            echo "ℹ️  No ./tests directory and no ./src projects — skipping test stage (template-pack / in-dev shape)."
            exit 0
          fi

          mapfile -d '' -t test_projects < <(find ./tests -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -not -name "*.Tests.Integration.*" -print0)

          # Report any integration test projects deliberately excluded from the
          # coverage gate, so the skip is visible rather than silent (they are
          # expected to run in a separate workflow).
          mapfile -d '' -t excluded_integration < <(find ./tests -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -name "*.Tests.Integration.*" -print0)
          if [ ${#excluded_integration[@]} -gt 0 ]; then
            echo "::notice::Excluded ${#excluded_integration[@]} integration test project(s) from the coverage gate (expected to run in a separate workflow): ${excluded_integration[*]}"
          fi

          if [ ${#test_projects[@]} -eq 0 ]; then
            if find ./src -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -print -quit 2>/dev/null | grep -q .; then
              echo "❌ No test projects under ./tests but ./src contains projects — refusing to silently skip the coverage gate."
              exit 1
            fi
            echo "ℹ️  No test projects found under ./tests and no ./src projects — skipping test stage (template-pack / in-dev shape)."
            exit 0
          fi
          
          echo "=========================================="
          echo "Found test projects:"
          echo "=========================================="
          printf '%s\n' "${test_projects[@]}"
          echo ""
          
          for test_proj in "${test_projects[@]}"; do
            echo "=========================================="
            echo "Testing project: $test_proj"
            echo "=========================================="
            
            # Extract target frameworks via MSBuild property evaluation (handles multi-line XML
            # and Directory.Build.props inheritance — both break grep-based parsing).
            # Falls back from <TargetFrameworks> (multiple) to <TargetFramework> (single).
            tfm_raw=$(dotnet msbuild "$test_proj" -noLogo -getProperty:TargetFrameworks 2>/dev/null \
              | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFrameworks[=:][[:space:]]*//' | tr -d '[:space:]')
            if [ -z "$tfm_raw" ]; then
              tfm_raw=$(dotnet msbuild "$test_proj" -noLogo -getProperty:TargetFramework 2>/dev/null \
                | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFramework[=:][[:space:]]*//' | tr -d '[:space:]')
            fi
            frameworks=$(printf '%s' "$tfm_raw" | tr ';' '\n' | grep -E '^(net(5\.0|6\.0|7\.0|8\.0|9\.0|10\.0)|netcoreapp3\.1)$' || true)
            
            if [ -z "$frameworks" ]; then
              echo "⊘ Skipping: No compatible .NET 5.0-10.0 target frameworks found"
              echo ""
              continue
            fi
            
            echo "Target frameworks: $(echo "$frameworks" | tr '\n' ' ')"
            echo ""
            
            # Test each framework that the project actually targets
            while IFS= read -r fw; do
              [ -z "$fw" ] && continue
              echo "Testing framework: $fw"
              
              # Capture the console output as well as showing it: `dotnet test`
              # exits 0 when the runner finds NO tests ("No test is available in
              # ..."), which is how ETL-FixedWidth ran zero tests on two TFMs for
              # weeks with a green CI. Fail the TFM unless the summary reports a
              # non-zero total (vstest prints "Total: N", MTP prints "total: N").
              test_log=$(mktemp)
              dotnet test "$test_proj" \
                --configuration Release \
                --framework "$fw" \
                --no-build --no-restore \
                --collect:"XPlat Code Coverage" \
                --settings coverlet.runsettings \
                --results-directory "./TestResults" \
                --logger "console;verbosity=minimal" 2>&1 | tee "$test_log" || exit 1
              if grep -q "No test is available" "$test_log" || ! grep -qiE "total:[[:space:]]*[1-9][0-9]*" "$test_log"; then
                echo "::error file=$test_proj::Zero tests ran for $fw — the test adapter found nothing to execute (missing/incompatible xunit.runner.visualstudio for this TFM?). dotnet test exits 0 in this case, so this guard fails the job instead."
                exit 1
              fi
              rm -f "$test_log"
            done <<< "$frameworks"
            echo ""
          done

      - name: Check for coverage files
        id: check-coverage
        run: |
          if find TestResults -type f -name "coverage.cobertura.xml" 2>/dev/null | grep -q .; then
            echo "has-coverage=true" >> "$GITHUB_OUTPUT"
            echo "✅ Coverage files found"
          else
            echo "has-coverage=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No coverage files found - skipping coverage report generation"
          fi

      - name: Install ReportGenerator
        if: steps.check-coverage.outputs.has-coverage == 'true'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: steps.check-coverage.outputs.has-coverage == 'true'
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"Html;TextSummary;MarkdownSummaryGithub;CsvSummary"

      - name: Enforce 90% coverage threshold
        if: steps.check-coverage.outputs.has-coverage == 'true'
        run: |
          if [ ! -f CoverageReport/Summary.txt ]; then
            echo "❌ Coverage report not generated!"
            exit 1
          fi

          echo "Coverage Summary:"
          cat CoverageReport/Summary.txt
          echo ""
          
          failed_projects=""
          threshold=${CODECOV_MINIMUM:-90}
          test_threshold=${CODECOV_TEST_MINIMUM:-100}
          matched_count=0

          # Build the set of assembly names produced by projects under tests/.
          #
          # DO NOT identify test assemblies by name. Shipped PRODUCT packages
          # legitimately contain "Test" — e.g. Wolfgang.Etl.TestKit and
          # Wolfgang.AuditTrail.TestKit.Xunit — and they live in src/. Matching
          # on the name would hold product code to the test threshold. The
          # project's LOCATION is the only reliable discriminator.
          #
          # Delimited with '|' on both sides so membership tests can't match a
          # prefix (|Foo| must not match |FooBar|).
          test_assemblies="|"
          if [ -d ./tests ]; then
            while IFS= read -r -d '' proj; do
              asm=$(grep -oE '<AssemblyName>[^<]+' "$proj" 2>/dev/null | head -1 | cut -d'>' -f2)
              if [ -z "$asm" ]; then
                asm=$(basename "$proj"); asm="${asm%.*}"
              fi
              test_assemblies="${test_assemblies}${asm}|"
            done < <(find ./tests -type f \( -name '*.csproj' -o -name '*.vbproj' -o -name '*.fsproj' \) -print0)
          fi
          echo "Test assemblies (gated at ${test_threshold}%): ${test_assemblies}"
          echo ""

          # IFS= is REQUIRED. ReportGenerator indents per-class rows two spaces
          # beneath their parent assembly row, and the filter below anchors on
          # `^[^ ]` to skip them. A bare `read -r line` strips leading IFS
          # whitespace, so the indentation is gone before grep sees it and every
          # class row matches — which gated individual test classes as if they
          # were projects.
          # shellcheck disable=SC2094  # false positive: the loop redirect and the inner awk both only READ Summary.txt
          while IFS= read -r line; do
            # Match lines with module names and percentages. The percent
            # capture is the LAST %-suffixed number on the line, matching
            # Stage 2's behavior — ReportGenerator Summary.txt rows often
            # have line/branch/method columns and the overall figure is at
            # end-of-line.
            if echo "$line" | grep -qE '^[^ ].*[0-9]+(\.[0-9]+)?%$' && ! echo "$line" | grep -q '^Summary'; then
              module=$(echo "$line" | awk '{print $1}')
              # Floor the percent to int (matches Stage 2 pwsh's [int][math]::Floor)
              # so we can use bash's integer -lt comparator below without
              # erroring on decimals like "90.4".
              percent=$(echo "$line" | awk '{print $NF}' | tr -d '%' | awk '{print int($1)}')
              matched_count=$((matched_count + 1))

              # Gating the test ASSEMBLY row at 100% is equivalent to gating
              # every one of its classes: an assembly only reaches 100% line
              # coverage when every class in it is at 100%.
              case "$test_assemblies" in
                *"|${module}|"*) applies=$test_threshold; kind="test" ;;
                *)               applies=$threshold;      kind="src"  ;;
              esac

              echo "Checking ${kind} module: '$module' - Coverage: ${percent}%"

              if [ "$percent" -lt "$applies" ]; then
                echo "  ❌ FAIL: Below ${applies}% threshold"
                failed_projects="$failed_projects $module (${percent}%, needs ${applies}%)"
                # For a test assembly, name the classes that are short so the
                # fix is obvious without downloading the coverage artifact.
                if [ "$kind" = "test" ]; then
                  echo "  Classes below ${applies}%:"
                  awk -v asm="$module" '
                    /^[^ ]/ { in_asm = ($1 == asm) }
                    in_asm && /^  / && /[0-9]+(\.[0-9]+)?%$/ {
                      p = $NF; gsub("%","",p);
                      if (p + 0 < 100) printf "    %s  %s\n", $NF, $1
                    }' CoverageReport/Summary.txt
                fi
              else
                echo "  ✅ PASS: Meets ${applies}% threshold"
              fi
            fi
          done < CoverageReport/Summary.txt

          # Fail loudly when 0 modules matched - the regex is wrong or
          # Summary.txt format changed. Silently passing the gate when we
          # couldn't parse coverage is worse than failing.
          if [ "$matched_count" -eq 0 ]; then
            echo "❌ Coverage parser matched 0 modules in Summary.txt - regex or report format is out of sync. Refusing to silently pass the gate."
            exit 1
          fi

          if [ -n "$failed_projects" ]; then
            echo ""
            echo "=========================================="
            echo "❌ COVERAGE GATE FAILED"
            echo "=========================================="
            echo "Modules below their threshold: $failed_projects"
            echo ""
            echo "src assemblies must reach ${threshold}%; test assemblies must reach ${test_threshold}%."
            echo "For test assemblies: write a test first; if that isn't possible, refactor"
            echo "to make the code testable; use [ExcludeFromCodeCoverage] only as a last resort."
            echo ""
            echo "Stage 1 failed. Windows, macOS, and .NET Framework tests will NOT run."
            exit 1
          else
            echo ""
            echo "=========================================="
            echo "✅ COVERAGE GATE PASSED"
            echo "=========================================="
            echo "src assemblies meet ${threshold}%; test assemblies meet ${test_threshold}%."
            echo "Proceeding to Stage 2 (Windows and macOS tests)."
          fi

      - name: Upload Linux coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-linux
          path: |
            TestResults/
            CoverageReport/

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-output
          path: |
            src/**/bin/Release
            tests/**/bin/Release

  # ============================================================================
  # STAGE 2: Windows - All .NET Tests (Gated by Stage 1)
  # ============================================================================
  test-windows:
    name: "Stage 2: Windows Tests (.NET 5.0-10.0, Framework 4.6.2-4.8.1)"
    runs-on: windows-latest
    needs: [detect-projects, test-linux-core]
    if: github.repository != 'Chris-Wolfgang/repo-template' && needs.detect-projects.outputs.has-projects == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      
      - name: Fetch trusted configuration files from main branch
        # Skip for Dependabot — its package-version bumps to protected files (e.g.
        # Directory.Build.props) are legitimate and should not be overwritten by main's
        # older versions. Dependabot's identity is GitHub-controlled and not spoofable.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        shell: pwsh
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          Write-Host "Fetching configuration files from main branch to prevent malicious overrides..."
          
          # Fetch the main branch
          git fetch "$env:TRUSTED_MAIN_URL" main:main-branch
          
          # List of configuration files that should come from trusted main branch
          $configFiles = @(
            "Directory.Build.props",
            "Directory.Build.targets",
            "BannedSymbols.txt",
            "coverlet.runsettings"
          )
          
          # Copy each configuration file from main branch if it exists
          foreach ($configFile in $configFiles) {
            # Check if file exists in main branch
            $exists = git cat-file -e "main-branch:$configFile" 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  ✓ Copying $configFile from main branch"
              git show "main-branch:$configFile" | Out-File -FilePath $configFile -Encoding UTF8NoBOM
              # Out-File succeeds even when git show fails mid-stream, leaving
              # an empty/partial file that silently puts the PR's own config in
              # force. $LASTEXITCODE is git's exit code after the pipeline.
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::Failed to copy $configFile from main-branch (git show exited $LASTEXITCODE) - aborting to prevent silent fall-back to PR-supplied protected config."
                exit 1
              }
            } else {
              Write-Host "  ℹ️  $configFile not found in main branch, skipping"
            }
          }
          
          # Handle glob patterns for .globalconfig, .ruleset, and workflow files
          # *.editorconfig covers the root file and every nested one (a per-project
          # .editorconfig overrides analyzer severities for everything beneath it).
          $globPatterns = @("*.editorconfig", "*.globalconfig", "*.ruleset", "*.DotSettings", ".github/workflows/*.yml", ".github/workflows/*.yaml")
          foreach ($pattern in $globPatterns) {
            $files = git ls-tree -r --name-only main-branch | Select-String -Pattern $pattern.Replace("*", ".*")
            foreach ($file in $files) {
              if ($file) {
                Write-Host "  ✓ Copying $file from main branch"
                $dir = Split-Path -Parent $file
                if ($dir) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
                git show "main-branch:$file" | Out-File -FilePath $file -Encoding UTF8NoBOM
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error::Failed to copy $file from main-branch (git show exited $LASTEXITCODE) - aborting to prevent silent fall-back to PR-supplied protected config."
                  exit 1
                }
              }
            }
            # A file the PR ADDS under a protected pattern has no main copy to overwrite
            # it with: remove it from the checkout.
            $prFiles = git ls-files | Select-String -Pattern $pattern.Replace("*", ".*")
            foreach ($file in $prFiles) {
              git cat-file -e "main-branch:$file" 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) {
                Write-Host "  ✗ Removing PR-added $file (not in main branch)"
                Remove-Item -Force -LiteralPath "$file"
              }
            }
          }
          
          Write-Host ""
          Write-Host "✅ Configuration files secured - using versions from main branch"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: TFM parity between src/ and test projects (guard 3)
        # Warns when a src/ project targets a framework no test project can
        # exercise - the gap that let DbContextBuilder ship untested net47 /
        # net6.0 assets. Warning-only by design (a platform TFM may have no
        # test story yet); the point is that it is visible. Runs on this
        # stage because Windows has every SDK the matrix needs. The script is
        # taken from main so a PR cannot edit the check it is subject to;
        # when main does not carry it yet (first adoption) the step skips.
        shell: pwsh
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git fetch "$env:TRUSTED_MAIN_URL" main:refs/remotes/origin/main --depth=1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Failed to fetch origin/main"; exit 1 }
          git cat-file -e origin/main:scripts/tfm-parity.ps1 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::notice::scripts/tfm-parity.ps1 is not on main yet - skipping the TFM parity check."
            exit 0
          }
          git checkout origin/main -- scripts/tfm-parity.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Failed to checkout origin/main:scripts/tfm-parity.ps1"; exit 1 }
          pwsh ./scripts/tfm-parity.ps1

      - name: Restore .NET workloads
        # Some projects (MAUI / MauiHybrid / Android / iOS / WPF) declare workloads via
        # their TFMs (e.g. net10.0-android). For workload-bearing repos this installs them
        # before restore; for pure-library repos with no workload TFMs, skip entirely to
        # avoid ~5-15s of network-dependent setup and an extra failure mode.
        shell: bash
        run: |
          if find . -name '*.csproj' -type f -exec grep -lE 'net[0-9]+\.[0-9]+-(android|ios|maccatalyst|maui|tvos|tizen|browser)' {} \; | grep -q .; then
            echo "Workload-bearing TFMs detected — running dotnet workload restore"
            dotnet workload restore
          else
            echo "No workload-bearing TFMs in any csproj — skipping dotnet workload restore"
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run all .NET tests (.NET 5.0-10.0 and Framework 4.6.2-4.8.1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Gracefully skip if there is no ./tests directory (e.g. template-publishing
          # repos or library repos in early development that have no tests yet).
          # The coverage gate exists to enforce test coverage on shipping
          # code. If ./src has projects but ./tests doesn't, fail loudly
          # instead of silently passing the gate. Skip only for template-
          # pack / in-dev repos that have no source projects yet.
          $srcHasProjects = @(Get-ChildItem -Path './src' -Recurse -File -Include '*.csproj','*.vbproj','*.fsproj' -ErrorAction SilentlyContinue).Count -gt 0

          if (-not (Test-Path -Path './tests' -PathType Container)) {
            if ($srcHasProjects) {
              Write-Error "❌ ./tests directory is missing but ./src contains projects — refusing to silently skip the coverage gate."
              exit 1
            }
            Write-Host "ℹ️  No ./tests directory and no ./src projects — skipping test stage (template-pack / in-dev shape)."
            exit 0
          }

          $testProjects = @(Get-ChildItem -Path './tests/*' -Recurse -File -Include '*.csproj','*.vbproj','*.fsproj')

          if (@($testProjects).Count -eq 0) {
            if ($srcHasProjects) {
              Write-Error "❌ No test projects under ./tests but ./src contains projects — refusing to silently skip the coverage gate."
              exit 1
            }
            Write-Host "ℹ️  No test projects found under ./tests and no ./src projects — skipping test stage (template-pack / in-dev shape)."
            exit 0
          }
          
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "Found test projects:" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          $testProjects | ForEach-Object { Write-Host $_.FullName -ForegroundColor White }
          Write-Host ""
          
          foreach ($testProj in $testProjects) {
            Write-Host "==========================================" -ForegroundColor Cyan
            Write-Host "Testing project: $($testProj.FullName)" -ForegroundColor Cyan
            Write-Host "==========================================" -ForegroundColor Cyan
            
            # Extract target frameworks via MSBuild property evaluation (handles
            # multi-line XML, Directory.Build.props inheritance and conditional
            # properties — all of which break regex parsing of the raw csproj).
            # Same approach as Stage 1 / Stage 3. Falls back from
            # <TargetFrameworks> (multiple) to <TargetFramework> (single).
            $tfmRaw = (dotnet msbuild $testProj.FullName -noLogo -getProperty:TargetFrameworks 2>$null |
              Where-Object { $_ -and $_.Trim() } | Select-Object -Last 1)
            if (-not $tfmRaw) {
              $tfmRaw = (dotnet msbuild $testProj.FullName -noLogo -getProperty:TargetFramework 2>$null |
                Where-Object { $_ -and $_.Trim() } | Select-Object -Last 1)
            }
            $tfmRaw = ("$tfmRaw" -replace '^TargetFrameworks?[=:]\s*', '') -replace '\s', ''

            if (-not $tfmRaw) {
              Write-Host "⊘ Skipping: No target frameworks found" -ForegroundColor Yellow
              Write-Host ""
              continue
            }

            # Split by semicolon for multi-targeting projects
            $allFrameworks = @($tfmRaw -split ';' | Where-Object { $_ })
            $frameworks = @($allFrameworks | Where-Object { $_ -match '^net(5\.0|6\.0|7\.0|8\.0|9\.0|10\.0|462|47|471|472|48|481|coreapp3\.1)$' })

            # This stage is the full-TFM backstop (every TFM the other stages
            # skip runs here), so a TFM this allowlist drops runs NOWHERE. Say so
            # loudly instead of silently narrowing the matrix — a platform TFM
            # such as net10.0-android may legitimately have no CI story yet, but
            # it must be visible, not buried in a "no compatible frameworks" line.
            $droppedFrameworks = @($allFrameworks | Where-Object { $frameworks -notcontains $_ })
            if ($droppedFrameworks.Count -gt 0) {
              Write-Host "::warning file=$($testProj.FullName)::TFM(s) not covered by any CI stage: $($droppedFrameworks -join ', ') — no tests run for them anywhere in this workflow."
            }

            if ($frameworks.Count -eq 0) {
              Write-Host "⊘ Skipping: No compatible .NET 5.0-10.0 or Framework 4.6.2-4.8.1 target frameworks found" -ForegroundColor Yellow
              Write-Host ""
              continue
            }
            
            Write-Host "Target frameworks: $($frameworks -join ', ')" -ForegroundColor White
            Write-Host ""
            
            # Test each framework; collect coverage only for .NET 5.0+ TFMs.
            # netcoreapp3.1 and net4x are tested but excluded from coverage:
            # netcoreapp3.1 has no matching test TFM on Linux (Stage 1) so its numbers
            # would not be comparable; net4x cannot use the XPlat collector on Windows.
            foreach ($fw in $frameworks) {
              Write-Host "Testing framework: $fw" -ForegroundColor Yellow

              # Tee the console output so the zero-tests-ran guard below can read
              # it: `dotnet test` exits 0 when the runner finds NO tests, which is
              # how ETL-FixedWidth ran zero tests on two TFMs for weeks with a
              # green CI. Fail the TFM unless the summary reports a non-zero
              # total (vstest prints "Total: N", MTP prints "total: N").
              $testLog = [System.IO.Path]::GetTempFileName()
              if ($fw -match '^net([5-9]|[1-9][0-9]+)\.') {
                dotnet test $testProj.FullName `
                  --configuration Release `
                  --framework $fw `
                  --no-build --no-restore `
                  --collect:"XPlat Code Coverage" `
                  --settings coverlet.runsettings `
                  --results-directory "./TestResults" `
                  --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath $testLog
              } else {
                dotnet test $testProj.FullName `
                  --configuration Release `
                  --framework $fw `
                  --no-build --no-restore `
                  --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath $testLog
              }

              if ($LASTEXITCODE -ne 0) {
                Write-Error "Tests failed for $fw in $($testProj.Name)"
                exit 1
              }
              $testOutput = Get-Content $testLog -Raw
              Remove-Item $testLog -Force -ErrorAction SilentlyContinue
              if ($testOutput -match 'No test is available' -or $testOutput -notmatch '(?i)total:\s*[1-9][0-9]*') {
                Write-Host "::error file=$($testProj.FullName)::Zero tests ran for $fw — the test adapter found nothing to execute (missing/incompatible xunit.runner.visualstudio for this TFM?). dotnet test exits 0 in this case, so this guard fails the job instead."
                exit 1
              }
            }
            Write-Host ""
          }

      - name: Check for coverage files
        id: check-coverage
        run: |
          if (Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue) {
            echo "has-coverage=true" >> $env:GITHUB_OUTPUT
            Write-Host "✅ Coverage files found"
          } else {
            echo "has-coverage=false" >> $env:GITHUB_OUTPUT
            Write-Host "ℹ️  No coverage files found - skipping coverage report generation"
          }
        shell: pwsh

      - name: Install ReportGenerator
        if: steps.check-coverage.outputs.has-coverage == 'true'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: steps.check-coverage.outputs.has-coverage == 'true'
        shell: pwsh
        run: |
          reportgenerator `
            -reports:"TestResults/**/coverage.cobertura.xml" `
            -targetdir:"CoverageReport" `
            -reporttypes:"Html;TextSummary;MarkdownSummaryGithub;CsvSummary"

      - name: Enforce 90% coverage threshold
        if: steps.check-coverage.outputs.has-coverage == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "CoverageReport/Summary.txt")) {
            Write-Error "❌ Coverage report not generated!"
            exit 1
          }

          Write-Host "Coverage Summary:"
          Get-Content "CoverageReport/Summary.txt"
          Write-Host ""

          $threshold     = if ($env:CODECOV_MINIMUM) { [int]$env:CODECOV_MINIMUM } else { 90 }
          $testThreshold = if ($env:CODECOV_TEST_MINIMUM) { [int]$env:CODECOV_TEST_MINIMUM } else { 100 }
          $failedProjects = @()
          $matchedCount   = 0

          # Set of assembly names produced by projects under tests/ — see the
          # matching Stage 1 block. Identify test assemblies by LOCATION, never
          # by name: shipped product packages such as Wolfgang.Etl.TestKit and
          # Wolfgang.AuditTrail.TestKit.Xunit contain "Test" and live in src/,
          # and matching on the name would hold product code to the test
          # threshold.
          $testAssemblies = @()
          if (Test-Path "tests") {
            Get-ChildItem -Path "tests" -Recurse -File -Include *.csproj,*.vbproj,*.fsproj | ForEach-Object {
              $m = [regex]::Match((Get-Content $_.FullName -Raw), '<AssemblyName>([^<]+)</AssemblyName>')
              $testAssemblies += $(if ($m.Success) { $m.Groups[1].Value.Trim() } else { $_.BaseName })
            }
          }
          Write-Host "Test assemblies (gated at ${testThreshold}%): $($testAssemblies -join ', ')"
          Write-Host ""

          foreach ($line in (Get-Content "CoverageReport/Summary.txt")) {
            # Only consider top-level assembly rows: non-space first char,
            # then anything, then whitespace + the final percent at EOL.
            # Matches Stage 1's `^[^ ].*[0-9]+(\.[0-9]+)?%$` filter (which
            # uses awk $NF for the percent — robust to extra columns like
            # line/branch/method that ReportGenerator can emit on the same
            # row).
            #
            # Bug previously here: a `.*` between the module name and the
            # trailing `(\d+)%` was greedy and could eat all but the last
            # digit of the percent — turning "100" into "0" and failing
            # the gate on actually-100%-covered modules. Two changes:
            #  - Anchor on `^(\S+)` so indented sub-class rows are skipped
            #    (their parent assembly row carries the same number, so
            #    nothing is lost). Stage 1 skips them too, but ONLY because
            #    its loop uses `IFS= read -r` — a bare `read -r` strips the
            #    indentation and defeats its `^[^ ]` anchor. Keep both in
            #    sync if either parser changes.
            #  - Require whitespace immediately before the final `\d+%`
            #    (`\s(\d+...)%\s*$`). This still allows intermediate
            #    columns between the module name and the final percent
            #    (the `.*` consumes them), but `.*` can't terminate
            #    mid-digit-run — the regex engine MUST place `\s` before
            #    the digits, which forces the last %-suffixed number on
            #    the line to be captured intact.
            if ($line -match '^(\S+).*\s(\d+(?:\.\d+)?)%\s*$' -and $line -notmatch '^Summary') {
              $module  = $Matches[1]
              $percent = [int][math]::Floor([double]$Matches[2])
              $matchedCount++

              # Gating the test ASSEMBLY row at 100% is equivalent to gating
              # every one of its classes: an assembly only reaches 100% line
              # coverage when every class in it is at 100%.
              $isTest  = $testAssemblies -contains $module
              $applies = if ($isTest) { $testThreshold } else { $threshold }
              $kind    = if ($isTest) { "test" } else { "src" }

              Write-Host "Checking $kind module: '$module' - Coverage: ${percent}%"

              if ($percent -lt $applies) {
                Write-Host "  ❌ FAIL: Below ${applies}% threshold" -ForegroundColor Red
                $failedProjects += "$module (${percent}%, needs ${applies}%)"
              } else {
                Write-Host "  ✅ PASS: Meets ${applies}% threshold" -ForegroundColor Green
              }
            }
          }

          # Fail loudly when 0 modules matched — the regex is wrong or
          # Summary.txt format changed. Silently passing the gate when we
          # couldn't read coverage is worse than failing.
          if ($matchedCount -eq 0) {
            Write-Error "❌ Coverage parser matched 0 modules in Summary.txt — regex or report format is out of sync. Refusing to silently pass the gate."
            exit 1
          }

          if ($failedProjects.Count -gt 0) {
            Write-Host ""
            Write-Host "==========================================" -ForegroundColor Red
            Write-Host "❌ COVERAGE GATE FAILED" -ForegroundColor Red
            Write-Host "==========================================" -ForegroundColor Red
            Write-Host "Modules below their threshold: $($failedProjects -join ', ')" -ForegroundColor Red
            Write-Host ""
            Write-Host "src assemblies must reach ${threshold}%; test assemblies must reach ${testThreshold}%." -ForegroundColor Red
            Write-Host ""
            Write-Host "Stage 2 failed. macOS tests will NOT run."
            exit 1
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "✅ COVERAGE GATE PASSED" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "src assemblies meet ${threshold}%; test assemblies meet ${testThreshold}%."
          Write-Host "Proceeding to Stage 3 (macOS tests)."

      - name: Upload Windows coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-windows
          path: |
            TestResults/
            CoverageReport/

  # ============================================================================
  # STAGE 3: macOS Tests (Gated by Stage 2)
  # ============================================================================
  test-macos-core:
    name: "Stage 3: macOS Tests (.NET 6.0-10.0)"
    runs-on: macos-latest
    needs: [detect-projects, test-windows]
    if: github.repository != 'Chris-Wolfgang/repo-template' && needs.detect-projects.outputs.has-projects == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      
      - name: Fetch trusted configuration files from main branch
        # Skip for Dependabot — its package-version bumps to protected files (e.g.
        # Directory.Build.props) are legitimate and should not be overwritten by main's
        # older versions. Dependabot's identity is GitHub-controlled and not spoofable.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          echo "Fetching configuration files from main branch to prevent malicious overrides..."
          
          # Fetch the main branch
          git fetch "$TRUSTED_MAIN_URL" main:main-branch
          
          # List of configuration files that should come from trusted main branch
          config_files=(
            "*.editorconfig"
            "Directory.Build.props"
            "Directory.Build.targets"
            "BannedSymbols.txt"
            "coverlet.runsettings"
            "*.globalconfig"
            "*.ruleset"
            "*.DotSettings"
            ".github/workflows/*.yml"
            ".github/workflows/*.yaml"
          )
          
          # Copy each configuration file from main branch if it exists
          for config_file in "${config_files[@]}"; do
            # Handle glob patterns
            if [[ "$config_file" == *"*"* ]]; then
              # Find files matching the pattern in main branch.
              # NOTE: use process substitution (`done < <(...)`) instead of a
              # plain pipeline. A piped `while` runs in a subshell — an
              # `exit 1` from inside would only kill the subshell, not the
              # outer step, letting a failed copy silently fall back to the
              # PR-supplied protected config. Process substitution runs the
              # loop in the parent shell so exit actually terminates the job.
              while read -r file; do
                if [ -n "$file" ]; then
                  echo "  ✓ Copying $file from main branch"
                  mkdir -p "$(dirname "$file")"
                  if ! git show "main-branch:$file" > "$file"; then
                    echo "::error::Failed to copy $file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                    exit 1
                  fi
                fi
              # Mask grep's exit 1 on zero matches with `|| true` — under
              # `set -eo pipefail`, an empty match would otherwise fail the step,
              # but a pattern like `*.ruleset` legitimately has no matches in
              # repos that don't ship one. The empty stream is fine; the while
              # loop simply doesn't iterate.
              done < <(git ls-tree -r --name-only main-branch | { grep -iE "${config_file//\*/.*}" || true; })
              # A file the PR ADDS under a protected pattern (a new nested .editorconfig,
              # .globalconfig, ...) is as effective as an edited one and has no main copy
              # to overwrite it with: remove it from the checkout.
              while read -r file; do
                if [ -n "$file" ] && ! git cat-file -e "main-branch:$file" 2>/dev/null; then
                  echo "  ✗ Removing PR-added $file (not in main branch)"
                  rm -f "$file"
                fi
              done < <(git ls-files | { grep -iE "${config_file//\*/.*}" || true; })
            else
              # Check if file exists in main branch
              if git cat-file -e "main-branch:$config_file" 2>/dev/null; then
                echo "  ✓ Copying $config_file from main branch"
                if ! git show "main-branch:$config_file" > "$config_file"; then
                  echo "::error::Failed to copy $config_file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                  exit 1
                fi
              else
                echo "  ℹ️  $config_file not found in main branch, skipping"
              fi
            fi
          done
          
          echo ""
          echo "✅ Configuration files secured - using versions from main branch"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore .NET workloads
        # Some projects (MAUI / MauiHybrid / Android / iOS / WPF) declare workloads via
        # their TFMs (e.g. net10.0-android). For workload-bearing repos this installs them
        # before restore; for pure-library repos with no workload TFMs, skip entirely to
        # avoid ~5-15s of network-dependent setup and an extra failure mode.
        shell: bash
        run: |
          if find . -name '*.csproj' -type f -exec grep -lE 'net[0-9]+\.[0-9]+-(android|ios|maccatalyst|maui|tvos|tizen|browser)' {} \; | grep -q .; then
            echo "Workload-bearing TFMs detected — running dotnet workload restore"
            dotnet workload restore
          else
            echo "No workload-bearing TFMs in any csproj — skipping dotnet workload restore"
          fi

      - name: Restore and build (exclude .NET Framework-only projects)
        run: |
          echo "Enumerating tracked .NET project files (git ls-files)..."
          
          # Filter out projects that ONLY target .NET Framework 4.x
          # Multi-targeting projects (e.g., net8.0;net48) will be INCLUDED
          projects=()
          project_found=false
          
          while IFS= read -r -d '' proj; do
            project_found=true
            # Check if project has any .NET 6+ target framework (macOS ARM64 compatible)
            # Look for: net6.0, net7.0, net8.0, net9.0, net10.0
            # Normalize newlines to spaces so multi-line <TargetFrameworks> elements are matched correctly
            if tr $'\n' ' ' < "$proj" | grep -qE '<TargetFramework[s]?>[^<]*net(6\.0|7\.0|8\.0|9\.0|10\.0)'; then
              projects+=("$proj")
              echo "✓ Including: $proj (has .NET 6+ target)"
            else
              echo "⊘ Excluding: $proj (no .NET 6+ target, incompatible with macOS ARM64)"
            fi
          done < <(git ls-files -z -- '*.csproj' '*.vbproj' '*.fsproj')
          
          if [ "$project_found" = false ]; then
            echo "❌ No .NET projects found."
            echo "This should not occur as detect-projects already verified project existence."
            exit 1
          fi
          
          if [ ${#projects[@]} -eq 0 ]; then
            echo "❌ No compatible .NET projects found."
            echo "All projects lack .NET 6+ targets, which are required for macOS ARM64."
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "Projects to build (excluding .NET Framework-only projects):"
          echo "=========================================="
          printf '%s\n' "${projects[@]}"
          echo ""
          
          # Restore each project
          echo "Restoring projects..."
          for proj in "${projects[@]}"; do
            echo "Restoring: $proj"
            dotnet restore "$proj" || exit 1
          done
          
          echo ""
          echo "Building projects..."
          # Build each project, handling multi-targeting projects
          # For multi-targeting projects, build only macOS ARM64-compatible frameworks (net6.0-10.0)
          for proj in "${projects[@]}"; do
            echo "Building: $proj"
            
            # Extract target frameworks via MSBuild property evaluation (handles multi-line XML
            # and Directory.Build.props inheritance). Filter to .NET 6+ for macOS ARM64 compatibility.
            # Falls back from <TargetFrameworks> (multiple) to <TargetFramework> (single).
            tfm_raw=$(dotnet msbuild "$proj" -noLogo -getProperty:TargetFrameworks 2>/dev/null \
              | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFrameworks[=:][[:space:]]*//' | tr -d '[:space:]')
            if [ -z "$tfm_raw" ]; then
              tfm_raw=$(dotnet msbuild "$proj" -noLogo -getProperty:TargetFramework 2>/dev/null \
                | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFramework[=:][[:space:]]*//' | tr -d '[:space:]')
            fi
            frameworks=$(printf '%s' "$tfm_raw" | tr ';' '\n' | grep -E '^net(6\.0|7\.0|8\.0|9\.0|10\.0)$' || true)
            
            if [ -z "$frameworks" ]; then
              echo "⚠️  No macOS ARM64-compatible frameworks found in $proj"
              continue
            fi
            
            # Check if this is a multi-targeting project
            framework_count=$(echo "$frameworks" | wc -l)
            
            if [ "$framework_count" -eq 1 ]; then
              # Single target framework - build normally
              echo "  Target framework: $frameworks"
              dotnet build "$proj" --no-restore --configuration Release || exit 1
            else
              # Multi-targeting project - build each compatible framework separately
              echo "  Target frameworks (multi-targeting): $(echo "$frameworks" | tr '\n' ' ')"
              while IFS= read -r fw; do
                [ -z "$fw" ] && continue
                echo "  Building framework: $fw"
                dotnet build "$proj" --no-restore --configuration Release --framework "$fw" || exit 1
              done <<< "$frameworks"
            fi
          done
          
          echo ""
          echo "✅ All compatible projects built successfully"

      - name:  Run tests (.NET 6.0 - 10.0 only - ARM64 compatible)
        # Explicit bash for pipefail — see Stage 1.
        shell: bash
        run: |
          # Find all test projects (C#, VB.NET, F#).
          # Gracefully skip if there is no ./tests directory (e.g. template-publishing
          # repos or library repos in early development that have no tests yet).
          # Fail loudly if the repo HAS src/ projects — the coverage gate
          # exists to enforce test coverage on shipping code, so silently
          # passing when tests are missing is the wrong default. Skip only
          # for template-pack / in-dev repos with no source projects yet.
          if [ ! -d ./tests ]; then
            if find ./src -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -print -quit 2>/dev/null | grep -q .; then
              echo "❌ ./tests directory is missing but ./src contains projects — refusing to silently skip the coverage gate."
              exit 1
            fi
            echo "ℹ️  No ./tests directory and no ./src projects — skipping test stage (template-pack / in-dev shape)."
            exit 0
          fi

          test_projects=()
          while IFS= read -r -d '' file; do
          test_projects+=("$file")
          done < <(find ./tests -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -not -name "*.Tests.Integration.*" -print0)

          # Report any integration test projects deliberately excluded from the
          # coverage gate, so the skip is visible rather than silent (they are
          # expected to run in a separate workflow).
          mapfile -d '' -t excluded_integration < <(find ./tests -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -name "*.Tests.Integration.*" -print0)
          if [ ${#excluded_integration[@]} -gt 0 ]; then
            echo "::notice::Excluded ${#excluded_integration[@]} integration test project(s) from the coverage gate (expected to run in a separate workflow): ${excluded_integration[*]}"
          fi

          if [ ${#test_projects[@]} -eq 0 ]; then
            if find ./src -type f \( -name "*.csproj" -o -name "*.vbproj" -o -name "*.fsproj" \) -print -quit 2>/dev/null | grep -q .; then
              echo "❌ No test projects under ./tests but ./src contains projects — refusing to silently skip the coverage gate."
              exit 1
            fi
            echo "ℹ️  No test projects found under ./tests and no ./src projects — skipping test stage (template-pack / in-dev shape)."
            exit 0
          fi
          
          echo "=========================================="
          echo "Found test projects:"
          echo "=========================================="
          printf '%s\n' "${test_projects[@]}"
          echo ""
          
          for test_proj in "${test_projects[@]}"; do
            echo "=========================================="
            echo "Testing project: $test_proj"
            echo "=========================================="
            
            # Extract target frameworks via MSBuild property evaluation (handles multi-line XML
            # and Directory.Build.props inheritance). Filter to .NET 6+ for macOS ARM64 compatibility.
            # Falls back from <TargetFrameworks> (multiple) to <TargetFramework> (single).
            tfm_raw=$(dotnet msbuild "$test_proj" -noLogo -getProperty:TargetFrameworks 2>/dev/null \
              | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFrameworks[=:][[:space:]]*//' | tr -d '[:space:]')
            if [ -z "$tfm_raw" ]; then
              tfm_raw=$(dotnet msbuild "$test_proj" -noLogo -getProperty:TargetFramework 2>/dev/null \
                | grep -v '^[[:space:]]*$' | tail -n1 | sed 's/^TargetFramework[=:][[:space:]]*//' | tr -d '[:space:]')
            fi
            frameworks=$(printf '%s' "$tfm_raw" | tr ';' '\n' | grep -E '^net(6\.0|7\.0|8\.0|9\.0|10\.0)$' || true)
            
            if [ -z "$frameworks" ]; then
              echo "⊘ Skipping: No compatible .NET 6.0-10.0 target frameworks found (ARM64 required)"
              echo ""
              continue
            fi
            
            echo "Target frameworks: $(echo "$frameworks" | tr '\n' ' ')"
            echo ""
            
            # Test each framework that the project actually targets
            # All frameworks here are net6.0+ so all get coverage
            while IFS= read -r fw; do
              [ -z "$fw" ] && continue
              echo "Testing framework: $fw"

              # Zero-tests-ran guard — see Stage 1 for the rationale.
              test_log=$(mktemp)
              dotnet test "$test_proj" \
                --configuration Release \
                --framework "$fw" \
                --no-build --no-restore \
                --collect:"XPlat Code Coverage" \
                --settings coverlet.runsettings \
                --results-directory "./TestResults" \
                --logger "console;verbosity=normal" 2>&1 | tee "$test_log" || exit 1
              if grep -q "No test is available" "$test_log" || ! grep -qiE "total:[[:space:]]*[1-9][0-9]*" "$test_log"; then
                echo "::error file=$test_proj::Zero tests ran for $fw — the test adapter found nothing to execute (missing/incompatible xunit.runner.visualstudio for this TFM?). dotnet test exits 0 in this case, so this guard fails the job instead."
                exit 1
              fi
              rm -f "$test_log"
            done <<< "$frameworks"
            echo ""
          done

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          if find ./TestResults -name "coverage.cobertura.xml" -print -quit 2>/dev/null | grep -q .; then
            reportgenerator \
              -reports:"TestResults/**/coverage.cobertura.xml" \
              -targetdir:"CoverageReport" \
              -reporttypes:"Html;TextSummary;MarkdownSummaryGithub;CsvSummary"
          else
            echo "ℹ️  No coverage files found - skipping report generation"
          fi

      - name: Enforce 90% coverage threshold
        run: |
          # If no cobertura files were produced (no tests, all test projects
          # skipped, etc.), the preceding step explicitly skipped report
          # generation. Mirror that here — gating only when coverage was
          # actually collected — instead of failing with "Coverage report
          # not generated!" on jobs that legitimately had nothing to cover.
          if ! find ./TestResults -name "coverage.cobertura.xml" -print -quit 2>/dev/null | grep -q .; then
            echo "ℹ️  No coverage files produced — skipping coverage gate (consistent with the prior 'skipping report generation' notice)."
            exit 0
          fi
          if [ ! -f "CoverageReport/Summary.txt" ]; then
            echo "❌ Coverage files exist but Summary.txt is missing — ReportGenerator failed."
            exit 1
          fi

          echo "Coverage Summary:"
          cat CoverageReport/Summary.txt
          echo ""

          THRESHOLD=${CODECOV_MINIMUM:-90}
          TEST_THRESHOLD=${CODECOV_TEST_MINIMUM:-100}
          FAILED=0
          MATCHED=0

          # Assembly names produced by projects under tests/ — see the matching
          # Stage 1 block. Identify test assemblies by LOCATION, never by name:
          # shipped product packages such as Wolfgang.Etl.TestKit live in src/
          # and contain "Test".
          TEST_ASSEMBLIES="|"
          if [ -d ./tests ]; then
            while IFS= read -r -d '' proj; do
              asm=$(grep -oE '<AssemblyName>[^<]+' "$proj" 2>/dev/null | head -1 | cut -d'>' -f2)
              if [ -z "$asm" ]; then
                asm=$(basename "$proj"); asm="${asm%.*}"
              fi
              TEST_ASSEMBLIES="${TEST_ASSEMBLIES}${asm}|"
            done < <(find ./tests -type f \( -name '*.csproj' -o -name '*.vbproj' -o -name '*.fsproj' \) -print0)
          fi
          echo "Test assemblies (gated at ${TEST_THRESHOLD}%): ${TEST_ASSEMBLIES}"
          echo ""

          while IFS= read -r line; do
            if echo "$line" | grep -qE '^[^ ]+.*[0-9]+%$' && ! echo "$line" | grep -q '^Summary'; then
              MODULE=$(echo "$line" | awk '{print $1}')
              PERCENT=$(echo "$line" | grep -oE '[0-9]+(\.[0-9]+)?%' | tail -1 | grep -oE '^[0-9]+')
              MATCHED=$((MATCHED + 1))
              case "$TEST_ASSEMBLIES" in
                *"|${MODULE}|"*) APPLIES=$TEST_THRESHOLD; KIND="test" ;;
                *)               APPLIES=$THRESHOLD;      KIND="src"  ;;
              esac
              echo "Checking ${KIND} module: '$MODULE' - Coverage: ${PERCENT}%"
              if [ "$PERCENT" -lt "$APPLIES" ]; then
                echo "  ❌ FAIL: Below ${APPLIES}% threshold"
                FAILED=1
              else
                echo "  ✅ PASS: Meets ${APPLIES}% threshold"
              fi
            fi
          done < CoverageReport/Summary.txt

          # Fail loudly when 0 modules matched — the regex is wrong or the
          # Summary.txt format changed. Silently passing here would make Stage 3
          # the weak link while Stages 1/2 fail loudly on the same drift.
          if [ "$MATCHED" -eq 0 ]; then
            echo "❌ Coverage parser matched 0 modules in Summary.txt — regex or report format is out of sync. Refusing to silently pass the gate."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "❌ COVERAGE GATE FAILED"
            echo "=========================================="
            echo "One or more modules are below their threshold"
            echo "(src ${THRESHOLD}%, test ${TEST_THRESHOLD}%)."
            echo "Stage 3 failed."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "✅ COVERAGE GATE PASSED"
          echo "=========================================="
          echo "src assemblies meet ${THRESHOLD}%; test assemblies meet ${TEST_THRESHOLD}%."

      - name: Upload macOS coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-macos
          path: |
            TestResults/
            CoverageReport/

      - name: Display macOS architecture info
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "ℹ️  macOS Testing Notes"
          echo "=========================================="
          echo "Architecture: $(uname -m)"
          echo ""
          echo "Skipped frameworks (no ARM64 support):"
          echo "  - .NET 5.0 ❌"
          echo ""
          echo "Tested frameworks (ARM64 compatible):"
          echo "  - .NET 6.0 ✅"
          echo "  - .NET 7.0 ✅"
          echo "  - .NET 8.0 ✅"
          echo "  - .NET 9.0 ✅"
          echo "  - .NET 10.0 ✅"
          echo ""
          echo ".NET Core 5.0 are tested on Linux and Windows"
          echo ""

      - name: Summarize pipeline result
        run: |
          echo "=========================================="
          echo "✅ ALL STAGES PASSED"
          echo "=========================================="
          echo "Stage 1: Linux tests + 90% coverage ✅"
          echo "Stage 2: Windows .NET Core & .NET Framework tests ✅"
          echo "Stage 3: macOS tests ✅"
          echo ""
          echo "PR is ready to merge! 🎉"

  # ============================================================================
  # Security Scan (Runs in parallel, independently of .NET jobs)
  # ============================================================================
  security-scan:
    name: "Security Scan (DevSkim)"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      
      - name: Fetch trusted configuration files from main branch
        # Skip for Dependabot — its package-version bumps to protected files (e.g.
        # Directory.Build.props) are legitimate and should not be overwritten by main's
        # older versions. Dependabot's identity is GitHub-controlled and not spoofable.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          # The checkout uses persist-credentials:false (nothing in .git/config for
          # PR-controlled build steps to read), so a bare `git fetch origin` has no
          # auth and fails on a private repository. Pass the job token on this one
          # command only; it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          echo "Fetching configuration files from main branch to prevent malicious overrides..."
          
          # Fetch the main branch
          git fetch "$TRUSTED_MAIN_URL" main:main-branch
          
          # List of configuration files that should come from trusted main branch
          config_files=(
            "*.editorconfig"
            "Directory.Build.props"
            "Directory.Build.targets"
            "BannedSymbols.txt"
            "coverlet.runsettings"
            "*.globalconfig"
            "*.ruleset"
            "*.DotSettings"
            ".github/workflows/*.yml"
            ".github/workflows/*.yaml"
          )
          
          # Copy each configuration file from main branch if it exists
          for config_file in "${config_files[@]}"; do
            # Handle glob patterns
            if [[ "$config_file" == *"*"* ]]; then
              # Find files matching the pattern in main branch.
              # NOTE: use process substitution (`done < <(...)`) instead of a
              # plain pipeline. A piped `while` runs in a subshell — an
              # `exit 1` from inside would only kill the subshell, not the
              # outer step, letting a failed copy silently fall back to the
              # PR-supplied protected config. Process substitution runs the
              # loop in the parent shell so exit actually terminates the job.
              while read -r file; do
                if [ -n "$file" ]; then
                  echo "  ✓ Copying $file from main branch"
                  mkdir -p "$(dirname "$file")"
                  if ! git show "main-branch:$file" > "$file"; then
                    echo "::error::Failed to copy $file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                    exit 1
                  fi
                fi
              # Mask grep's exit 1 on zero matches with `|| true` — under
              # `set -eo pipefail`, an empty match would otherwise fail the step,
              # but a pattern like `*.ruleset` legitimately has no matches in
              # repos that don't ship one. The empty stream is fine; the while
              # loop simply doesn't iterate.
              done < <(git ls-tree -r --name-only main-branch | { grep -iE "${config_file//\*/.*}" || true; })
              # A file the PR ADDS under a protected pattern (a new nested .editorconfig,
              # .globalconfig, ...) is as effective as an edited one and has no main copy
              # to overwrite it with: remove it from the checkout.
              while read -r file; do
                if [ -n "$file" ] && ! git cat-file -e "main-branch:$file" 2>/dev/null; then
                  echo "  ✗ Removing PR-added $file (not in main branch)"
                  rm -f "$file"
                fi
              done < <(git ls-files | { grep -iE "${config_file//\*/.*}" || true; })
            else
              # Check if file exists in main branch
              if git cat-file -e "main-branch:$config_file" 2>/dev/null; then
                echo "  ✓ Copying $config_file from main branch"
                if ! git show "main-branch:$config_file" > "$config_file"; then
                  echo "::error::Failed to copy $config_file from main-branch — aborting to prevent silent fall-back to PR-supplied protected config."
                  exit 1
                fi
              else
                echo "  ℹ️  $config_file not found in main branch, skipping"
              fi
            fi
          done
          
          echo ""
          echo "✅ Configuration files secured - using versions from main branch"

      - name: Install DevSkim CLI
        run: dotnet tool install --global Microsoft.CST.DevSkim.CLI

      - name: Run DevSkim security scan
        run: |
          devskim analyze \
            --source-code . \
            --file-format text \
            --output-file devskim-results.txt \
            --ignore-rule-ids DS176209 \
            --ignore-globs "**/api/**,**/CoverageReport/**,**/TestResults/**"

      - name: Display security scan results
        if: always()
        run: |
          if [ -f devskim-results.txt ]; then
            echo "=========================================="
            echo "DevSkim Security Scan Results"
            echo "=========================================="
            cat devskim-results.txt
            echo ""
            
            if grep -qi "error\|critical\|high" devskim-results.txt; then
              echo "❌ Security issues detected - review required"
              exit 1
            else
              echo "✅ No critical security issues found"
            fi
          else
            echo "✅ No security issues found"
          fi

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: devskim-results
          path: devskim-results.txt
          if-no-files-found: warn
