name: License Audit

# License audit of transitive dependencies. Validates every src/ project's full
# (direct + transitive) dependency closure against an allow-list of OSI-permissive
# licenses using the `nuget-license` tool, and FAILS if any dependency's license is
# not allowed (e.g. a copyleft or non-OSI license slipping in via a bump).
#
# Config lives in .github/license-audit/:
#  - allowed-licenses.json     — the licenses we accept: OSI-permissive ones plus one
#    explicit non-OSI exception, MS-.NET-Library (the Microsoft .NET Library license
#    some older System.* packages ship under - proprietary, but freely redistributable
#    with the package, so it imposes nothing on consumers of ours).
#  - url-license-mappings.json — maps packages that expose a license URL (not an SPDX
#    expression) to a license identifier: the dotnet/standard LICENSE.TXT is MIT, the
#    go.microsoft.com LinkId=329770 URL is MS-.NET-Library.
#  - package-overrides.json    — packages whose licence is a file inside the package
#    (nuget-license type "File", unmappable): id + pinned version + verified licence.
#  - ignored-packages.json     — SonarAnalyzer.CSharp: a build-time analyzer
#    (PrivateAssets=all, not shipped) under the non-OSI SONAR Source-Available
#    License, so it imposes no obligation on consumers of the package.
#
# On pull requests the four policy files are taken from main (fail closed), so a
# PR cannot allow a licence or ignore a package for its own audit; pr.yaml's
# protected-file guard makes such a PR configuration-only (see WORKFLOW_SECURITY.md).
#
# Skips automatically when the repo has no src/ project (e.g. the template repo).

on:
  pull_request:
  push:
    branches: [main]
  # Weekly re-audit of main: a package can change its license between the
  # versions Dependabot bumps, or a transitive can be re-licensed upstream
  # without any PR touching this repo. Tuesdays 06:15 UTC, off the Monday
  # Scorecard / Sunday CodeQL+Stryker slots.
  schedule:
    - cron: '15 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-audit:
    name: License audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The policy files decide what passes, so a PR must not be able to bring its own:
      # take them from main (fail closed), the way pr.yaml takes its trusted config.
      # pr.yaml's protected-file guard lists .github/license-audit/*.json, so a PR that
      # changes them is either configuration-only (merges on review, audited with the
      # OLD policy) or fails the guard until the policy change is split out.
      - name: Fetch license policy from main
        if: github.event_name == 'pull_request'
        env:
          # persist-credentials:false above, so pass the job token on this one command;
          # it is never written to git config.
          TRUSTED_MAIN_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if ! git fetch --quiet --depth=1 "$TRUSTED_MAIN_URL" main:refs/remotes/origin/main; then
            echo "::error::Failed to fetch origin/main - aborting before the license audit."
            exit 1
          fi
          for f in allowed-licenses.json ignored-packages.json url-license-mappings.json package-overrides.json; do
            path=".github/license-audit/$f"
            if ! git cat-file -e "origin/main:$path" 2>/dev/null; then
              echo "::error::$path is not present in origin/main - refusing to audit with the PR-controlled copy. Merge the policy file to main first."
              exit 1
            fi
            if ! git checkout --quiet origin/main -- "$path"; then
              echo "::error::Failed to checkout origin/main:$path - aborting to prevent a silent fall-back to the PR version."
              exit 1
            fi
          done
          echo "License policy files taken from origin/main."

      - name: Detect src projects
        id: detect
        run: |
          if git ls-files 'src/**/*.csproj' 'src/*.csproj' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No src/**/*.csproj found — skipping license audit."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore CI tools (nuget-license)
        if: steps.detect.outputs.found == 'true'
        # Pinned in .config/dotnet-tools.json; never installed unversioned.
        run: dotnet tool restore

      # Gate: fail if any src project's dependency license is not on the allow-list.
      - name: Restore .NET workloads
        # Same gate as pr.yaml: only repos with workload-bearing TFMs (net10.0-android,
        # -ios, -maui, ...) need this, and they need it once, before the per-project restore.
        if: steps.detect.outputs.found == 'true'
        run: |
          if find src -name '*.csproj' -type f -exec grep -lE 'net[0-9]+\.[0-9]+-(android|ios|maccatalyst|maui|tvos|tizen|browser)' {} \; | grep -q .; then
            echo "Workload-bearing TFMs detected - running dotnet workload restore"
            dotnet workload restore
          else
            echo "No workload-bearing TFMs under src/ - skipping dotnet workload restore"
          fi

      - name: Audit licenses (gate on allow-list)
        if: steps.detect.outputs.found == 'true'
        run: |
          while IFS= read -r proj; do
            echo "== $proj =="
            dotnet restore "$proj"
            dotnet nuget-license -i "$proj" -t \
              -a .github/license-audit/allowed-licenses.json \
              -ignore .github/license-audit/ignored-packages.json \
              -mapping .github/license-audit/url-license-mappings.json \
              -override .github/license-audit/package-overrides.json \
              -o Table
          done < <(git ls-files 'src/**/*.csproj' 'src/*.csproj')

      # The attribution file each package will ship with (release.yaml generates the
      # same thing before pack). Uploaded so a reviewer can see what a dependency
      # change does to it; it is never committed.
      - name: Generate third-party notices
        if: steps.detect.outputs.found == 'true'
        shell: pwsh
        run: |
          pwsh ./scripts/third-party-notices.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path third-party-notices | Out-Null
          foreach ($f in Get-ChildItem -Path src -Recurse -File -Filter THIRD-PARTY-NOTICES.md) {
            $name = Split-Path -Leaf (Split-Path -Parent (Split-Path -Parent $f.FullName))
            Copy-Item $f.FullName (Join-Path third-party-notices "$name.THIRD-PARTY-NOTICES.md")
          }

      - name: Upload third-party notices
        if: steps.detect.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: third-party-notices
          path: third-party-notices/
          retention-days: 30
