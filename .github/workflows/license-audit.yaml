name: License Audit

# License audit of transitive dependencies. Validates every src/ project's full
# (direct + transitive) dependency closure against an allow-list of OSI-permissive
# licenses using the `nuget-license` tool, and FAILS if any dependency's license is
# not allowed (e.g. a copyleft or non-OSI license slipping in via a bump).
#
# Config lives in .github/license-audit/:
#  - allowed-licenses.json     — the licenses we accept: OSI-permissive ones plus one
#    explicit non-OSI exception, MS-.NET-Library (the Microsoft .NET Library license
#    some older System.* packages ship under - proprietary, but freely redistributable
#    with the package, so it imposes nothing on consumers of ours).
#  - url-license-mappings.json — maps packages that expose a license URL (not an SPDX
#    expression) to a license identifier: the dotnet/standard LICENSE.TXT is MIT, the
#    go.microsoft.com LinkId=329770 URL is MS-.NET-Library.
#  - package-overrides.json    — packages whose licence is a file inside the package
#    (nuget-license type "File", unmappable): id + pinned version + verified licence.
#  - ignored-packages.json     — SonarAnalyzer.CSharp: a build-time analyzer
#    (PrivateAssets=all, not shipped) under the non-OSI SONAR Source-Available
#    License, so it imposes no obligation on consumers of the package.
#
# Skips automatically when the repo has no src/ project (e.g. the template repo).

on:
  pull_request:
  push:
    branches: [main]
  # Weekly re-audit of main: a package can change its license between the
  # versions Dependabot bumps, or a transitive can be re-licensed upstream
  # without any PR touching this repo. Tuesdays 06:15 UTC, off the Monday
  # Scorecard / Sunday CodeQL+Stryker slots.
  schedule:
    - cron: '15 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-audit:
    name: License audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect src projects
        id: detect
        run: |
          if git ls-files 'src/**/*.csproj' 'src/*.csproj' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No src/**/*.csproj found — skipping license audit."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install nuget-license
        if: steps.detect.outputs.found == 'true'
        run: dotnet tool install --global nuget-license

      # Gate: fail if any src project's dependency license is not on the allow-list.
      - name: Restore .NET workloads
        # Same gate as pr.yaml: only repos with workload-bearing TFMs (net10.0-android,
        # -ios, -maui, ...) need this, and they need it once, before the per-project restore.
        if: steps.detect.outputs.found == 'true'
        run: |
          if find src -name '*.csproj' -type f -exec grep -lE 'net[0-9]+\.[0-9]+-(android|ios|maccatalyst|maui|tvos|tizen|browser)' {} \; | grep -q .; then
            echo "Workload-bearing TFMs detected - running dotnet workload restore"
            dotnet workload restore
          else
            echo "No workload-bearing TFMs under src/ - skipping dotnet workload restore"
          fi

      - name: Audit licenses (gate on allow-list)
        if: steps.detect.outputs.found == 'true'
        run: |
          while IFS= read -r proj; do
            echo "== $proj =="
            dotnet restore "$proj"
            nuget-license -i "$proj" -t \
              -a .github/license-audit/allowed-licenses.json \
              -ignore .github/license-audit/ignored-packages.json \
              -mapping .github/license-audit/url-license-mappings.json \
              -override .github/license-audit/package-overrides.json \
              -o Table
          done < <(git ls-files 'src/**/*.csproj' 'src/*.csproj')
