# Protected-files guard: the one workflow that still runs on pull_request_target, and the
# reason it may — it never checks out or executes anything from the PR. It runs from main
# (so a PR cannot edit it), lists the PR's changed files through the API, and classifies
# the PR:
#   - no protected file changed      -> pass; pr.yaml validated everything
#   - only protected files changed   -> pass with a notice; a maintainer reviews the diff
#   - protected files + anything else -> FAIL, and nothing can bypass it: split the PR
# "Protected" is every file that shapes what CI checks: the workflows, analyzer config,
# build props, coverage config, the gitleaks config, the CI tool manifest, the
# license-audit policy and the CI scripts pr.yaml and license-audit.yaml run.
# Because pr.yaml runs on the PR's own copies of those files, a mixed PR would otherwise
# be able to weaken a gate and pass it in the same change.
name: Protected Files

on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:  # no checkout, no execution of PR content — see the note above
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: "Protected Files Guard"
    runs-on: ubuntu-latest
    # Dependabot's bumps to protected files (e.g. Directory.Build.props) are legitimate;
    # its identity is GitHub-controlled and not spoofable.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - name: Classify the PR's changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Every file the PR adds, modifies, renames, copies or deletes — the API's view of
          # the PR diff against its merge base, so a PR that is merely behind main is not
          # blamed for files main changed since it branched.
          # Captured and checked explicitly, NOT read straight into mapfile from a process
          # substitution: `set -e` does not see a failure inside <( ), so a failed or partly
          # paginated `gh api` would leave all_changed empty and this guard would cheerfully
          # report "no protected files changed". A guard that cannot list the diff must fail
          # closed, not open.
          if ! changed_raw=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "::error::Could not list this PR's changed files - refusing to classify the change."
            exit 1
          fi
          mapfile -t all_changed < <(printf '%s' "$changed_raw")
          if [ ${#all_changed[@]} -eq 0 ]; then
            echo "::error::The PR's changed-file list came back empty, which cannot be true for a pull request - refusing to classify."
            exit 1
          fi
          # The pull-request files endpoint is capped at 3000 files no matter how many pages are
          # requested, so --paginate alone cannot prove the list is complete. A PR above the cap
          # could hide a protected file outside the returned set and be classified on the rest.
          # Compare against the PR's own changed_files count and refuse if anything is missing.
          # all_changed also carries previous_filename for renames, so it may legitimately exceed
          # that count - only a SHORTFALL means truncation.
          if ! expected=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files'); then
            echo "::error::Could not read the PR's changed_files count - refusing to classify."
            exit 1
          fi
          if [ "${#all_changed[@]}" -lt "$expected" ]; then
            echo "::error::Listed ${#all_changed[@]} changed files but the PR reports $expected - the listing is truncated (the endpoint caps at 3000). Refusing to classify."
            exit 1
          fi
          protected=(); other=()
          for file in "${all_changed[@]}"; do
            # Matched on a lowercased copy: the exact-name branch below used to be
            # case-SENSITIVE while the regex branch was not, so a rename to
            # `directory.build.props` was classified as an ordinary file. Windows and macOS
            # resolve those paths case-insensitively, so the renamed file is still the one
            # MSBuild imports.
            lower=$(printf '%s' "$file" | tr '[:upper:]' '[:lower:]')
            case "$lower" in              .editorconfig|directory.build.props|directory.build.targets|bannedsymbols.txt|coverlet.runsettings|.config/dotnet-tools.json|.gitleaks.toml|scripts/changelog.ps1|scripts/tfm-parity.ps1|scripts/build-pr.ps1|scripts/third-party-notices.ps1) protected+=("$file") ;;
              # MSBuild imports Directory.Build.props/.targets by DIRECTORY, so a nested copy
              # (src/Directory.Build.props and friends) shapes the build exactly as the root one
              # does. Matching only the root names let a mixed PR change one of those unnoticed.
              */directory.build.props|*/directory.build.targets) protected+=("$file") ;;
              *)
                # -i: Windows (and ReSharper on it) resolve names case-insensitively, so
                # foo.dotsettings is as live as foo.DotSettings. The license-audit policy
                # files are read from main by license-audit.yaml, so a change to them is
                # configuration the PR cannot test - same rule as the workflows.
                if echo "$file" | grep -qiE '(\.(globalconfig|ruleset|DotSettings|editorconfig)|^\.github/workflows/.*\.ya?ml|^\.github/license-audit/.*\.json|^\.github/requirements/.*)$'; then protected+=("$file"); else other+=("$file"); fi ;;
            esac
          done

          if [ ${#protected[@]} -eq 0 ]; then
            echo "✅ No protected configuration files changed."
          elif [ ${#other[@]} -eq 0 ]; then
            echo ""
            echo "⚠️  CONFIGURATION-ONLY PULL REQUEST - protected files changed, nothing else:"
            for file in "${protected[@]}"; do echo "  - $file"; done
            echo ""
            echo "::notice::Configuration-only PR: pr.yaml ran with these ${#protected[@]} file(s) as changed. Review the diff itself before merging — this is the change that decides what future PRs are checked against."
          else
            echo ""
            echo "⚠️  PROTECTED CONFIGURATION FILES CHANGED ALONGSIDE OTHER CHANGES:"
            for file in "${protected[@]}"; do echo "  - $file"; done
            echo ""
            echo "❌ These files decide what CI checks, and this PR changes them together with"
            echo "   ${#other[@]} other file(s) that were checked under the changed rules."
            echo ""
            echo "Split the PR: put the protected files in their own PR (it passes this guard as"
            echo "configuration-only and merges on review), then rebase the rest on top so it is"
            echo "validated by the reviewed configuration. Nothing here can be bypassed."
            exit 1
          fi
